<!DOCTYPE html><meta charset="utf-8">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<body><pre id="o">running…</pre>
<script type="module">
// Headless smoke test for the non-GPU half of web/lib/cloth.js: load the real
// body twin, measure its capsules, draft a shirt around it, and assert the
// numbers are physically sensible. Runs without WebGPU or a camera.
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { measureCapsules, poseCapsules, draftShirt, buildGarmentGeometry, norm }
  from "../lib/cloth.js";

const log = [];
// Fallbacks that change results must be visible, not buried in a console
// nobody is watching. Capture them and fail the run on them.
const warnings = [];
const _warn = console.warn;
console.warn = (...a) => { warnings.push(a.join(" ")); _warn(...a); };
const say = (s) => { log.push(s); document.getElementById("o").textContent = log.join("\n"); };

const SPEC = [
  { label: "chestUpper", a: "spine01", b: "neck01", owners: ["spine01", "breast"], elliptical: true },
  { label: "chest", a: "spine03", b: "spine01", owners: ["spine02", "spine03", "breast"], elliptical: true },
  { label: "waist", a: "spine04", b: "spine03", owners: ["spine03", "spine04"], elliptical: true },
  { label: "hips", a: ["upperleg01.L", "upperleg01.R"], b: "spine04", owners: ["pelvis", "spine04"], elliptical: true },
  { label: "shoulderL", a: "clavicle.L", b: "upperarm01.L", owners: ["clavicle", "shoulder"], elliptical: false },
  { label: "shoulderR", a: "clavicle.R", b: "upperarm01.R", owners: ["clavicle", "shoulder"], elliptical: false },
  { label: "armL", a: "upperarm01.L", b: "lowerarm01.L", owners: ["upperarm01.L", "upperarm02.L"], elliptical: false },
  { label: "armR", a: "upperarm01.R", b: "lowerarm01.R", owners: ["upperarm01.R", "upperarm02.R"], elliptical: false },
  { label: "forearmL", a: "lowerarm01.L", b: "wrist.L", owners: ["lowerarm01.L", "lowerarm02.L"], elliptical: false },
  { label: "forearmR", a: "lowerarm01.R", b: "wrist.R", owners: ["lowerarm01.R", "lowerarm02.R"], elliptical: false },
  { label: "neck", a: "neck01", b: "head", owners: ["neck"], elliptical: false },
];

try {
  const gltf = await new GLTFLoader().loadAsync("../assets/bodytwin.glb");
  let skinned = null;
  gltf.scene.traverse((o) => { if (o.isSkinnedMesh) skinned = o; });
  const root = gltf.scene;

  // REPRODUCE THE LIVE PAGE'S TRANSFORM CHAIN. This is the whole reason the
  // test is worth having: an earlier version measured the bare gltf.scene at
  // the identity, passed cleanly, and the live page was badly broken anyway —
  // because there the model hangs under a group carrying the metres-to-pixels
  // scale and the mirror, and those had never been folded into the world
  // matrices when measuring ran.
  //
  // Deliberately NOT calling updateMatrixWorld on the parent afterwards: the
  // live page doesn't either before the first render, and that stale state is
  // exactly the condition the bug needed.
  const align = new THREE.Group();
  align.add(root);
  const PX_PER_M = 279;                 // what a 480 px frame works out to
  align.scale.set(-PX_PER_M, PX_PER_M, PX_PER_M);   // negative x == the mirror
  align.position.set(120, -40, 0);

  say(`model loaded: ${skinned.geometry.attributes.position.count} verts, ` +
      `${skinned.skeleton.bones.length} bones`);
  say(`nested under a group at scale ${PX_PER_M} with a mirrored x axis`);

  // Expected half-width / half-depth per capsule, read off body-slices.html.
  // Anything more than 2 cm away means the capsule is not measuring the body
  // part it claims to.
  const EXPECT = {
    chestUpper: [0.161, 0.082], chest: [0.146, 0.095], waist: [0.128, 0.086],
    hips: [0.146, 0.094],   // neck asserted separately, see below
    shoulderL: [0.072, 0.072], shoulderR: [0.072, 0.072],
    armL: [0.078, 0.078], armR: [0.078, 0.078],
    forearmL: [0.064, 0.064], forearmR: [0.064, 0.064],
  };

  const caps = measureCapsules(skinned, root, SPEC);
  say(`capsules measured: ${caps.length}/${SPEC.length}`);
  let fails = 0;
  for (const c of caps) {
    const e = EXPECT[c.label];
    const off = e ? Math.max(Math.abs(c.rx - e[0]), Math.abs(c.rz - e[1])) : 0;
    const bad = !isFinite(c.rx) || !isFinite(c.rz) || c.rx <= 0 || c.rz <= 0 || off > 0.02;
    if (bad) fails++;
    say(`  ${c.label.padEnd(11)} rx=${c.rx.toFixed(3)} rz=${c.rz.toFixed(3)} ` +
        `dz=${c.dz.toFixed(3)}   expect ${e ? e.join("/") : "?"}` +
        `${bad ? `   <<< OFF BY ${off.toFixed(3)} m` : "   ok"}`);
  }
  say(fails ? `${fails} CAPSULE(S) FAILED` : "all measured capsules within 20 mm of the mesh");

  // NECK, measured straight off the mesh rather than trusted from the capsule.
  // The expectation used to be 0.036 — which was this test's own earlier output,
  // and that output was a FALLBACK (segment length x 0.35), not a measurement.
  // Asserting against yourself only detects change, never correctness.
  {
    const byN = new Map(skinned.skeleton.bones.map((b) => [norm(b.name), b]));
    const neckY = root.worldToLocal(byN.get(norm("neck01"))
      .getWorldPosition(new THREE.Vector3())).y;
    const pa = skinned.geometry.attributes.position;
    const si = skinned.geometry.attributes.skinIndex;
    const sw = skinned.geometry.attributes.skinWeight;
    const names = skinned.skeleton.bones.map((b) => norm(b.name));
    const v = new THREE.Vector3();
    const rr = [];
    for (let i = 0; i < pa.count; i++) {
      let best = 0, bw = -1;
      for (let j = 0; j < 4; j++) {
        const w = sw.getComponent(i, j);
        if (w > bw) { bw = w; best = si.getComponent(i, j); }
      }
      if (!/^neck/.test(names[best] ?? "")) continue;
      v.fromBufferAttribute(pa, i).applyMatrix4(skinned.matrixWorld);
      root.worldToLocal(v);
      if (Math.abs(v.y - (neckY + 0.03)) > 0.02) continue;   // a band up the neck
      rr.push(Math.hypot(v.x, v.z));
    }
    rr.sort((a, b) => a - b);
    const truth = rr.length ? rr[Math.floor(rr.length * 0.95)] : null;
    const cap = caps.find((c) => c.label === "neck");
    const off = truth != null ? Math.abs(cap.rx - truth) : null;
    say(`  neck        rx=${cap.rx.toFixed(3)}   mesh says ${truth == null ? "?" : truth.toFixed(3)}` +
        ` (${rr.length} verts)${off != null && off > 0.02 ? `   <<< OFF BY ${off.toFixed(3)} m` : "   ok"}`);
    if (off != null && off > 0.02) fails++;
  }

  if (warnings.length) {
    say(`
${warnings.length} SILENT FALLBACK(S) — each one changed a result:`);
    for (const w of warnings) say("  " + w);
  } else {
    say("no fallbacks taken");
  }

  // Body frame from bone positions, exactly as the live page derives it.
  const byName = new Map(skinned.skeleton.bones.map((b) => [norm(b.name), b]));
  const P = (n) => root.worldToLocal(byName.get(norm(n)).getWorldPosition(new THREE.Vector3()));
  const left = P("upperarm01.L").sub(P("upperarm01.R")).normalize();
  const up = P("upperarm01.L").add(P("upperarm01.R")).multiplyScalar(0.5)
    .sub(P("upperleg01.L").add(P("upperleg01.R")).multiplyScalar(0.5)).normalize();
  const front = new THREE.Vector3().crossVectors(left, up).normalize();
  up.crossVectors(front, left).normalize();
  say(`frame  left=(${left.toArray().map((v) => v.toFixed(2))}) ` +
      `up=(${up.toArray().map((v) => v.toFixed(2))}) ` +
      `front=(${front.toArray().map((v) => v.toFixed(2))})`);

  poseCapsules(caps, root, { left, up, front }, 0);

  // ---- shoulder support geometry ----
  // Where the garment's widest ring sits relative to the actual shoulder
  // joints decides whether the shirt HANGS from the shoulders or slides off
  // them. This is the number that matters for "settles as a sack".
  const g0 = draftShirt({ caps, res: 44, ease: 0.03 });
  const pr = g0.profile;
  const gap = pr.shoulderJointHeight - pr.shoulderRingHeight;
  say(`
SHOULDER SUPPORT`);
  say(`  shoulder joints at height   ${pr.shoulderJointHeight.toFixed(3)} m`);
  say(`  garment's widest ring at    ${pr.shoulderRingHeight.toFixed(3)} m`);
  say(`  ring sits ${(gap * 1000).toFixed(0)} mm ${gap > 0 ? "BELOW" : "above"} the joints` +
      `${gap > 0.02 ? "   <<< nothing rests on the shoulders" : "   ok"}`);
  say(`  neck opening  r=${pr.neckR.toFixed(3)} m  circumference ` +
      `${(pr.neckCircum * 100).toFixed(1)} cm  (real crew neck ~40-44 cm)`);

  say(`
SEAM (sleeve -> body panel)`);
  say(`  stitches ${pr.seam.count}, avg ${(pr.seam.avgRest * 1000).toFixed(0)} mm, ` +
      `max ${(pr.seam.maxRest * 1000).toFixed(0)} mm` +
      `${pr.seam.maxRest > 0.05 ? "   <<< sleeve tacked on at a distance" : "   ok"}`);
  say(`  constraints ${pr.constraints.total} = ${pr.constraints.stretch} stretch ` +
      `(compliance 0, inextensible) + ${pr.constraints.bend} bend`);

  say(`
LENGTH`);
  const torsoLen = pr.neckHeight - (pr.hemHeight + 0.06);
  say(`  garment length (neck -> hem) ${(pr.garmentLength * 100).toFixed(1)} cm`);
  say(`  hem sits ${(pr.hemHeight * 100).toFixed(1)} cm relative to chest centre`);

  // ---- resolution scaling ----
  // Solve cost is roughly constraints x colours x iterations x substeps. The
  // colour count matters as much as the constraint count: each colour is a
  // separate dispatch with a sync between, so colours that grow with
  // resolution would eat the gain. GPU time itself cannot be measured here —
  // headless has no WebGPU device on this machine.
  say(`
RESOLUTION SCALING`);
  say(`  res   particles  constraints  colours(stretch+bend)  cut`);
  for (const r of [44, 52, 64, 80, 96, 112]) {
    const g = draftShirt({ caps, res: r, ease: 0.03 });
    const cut = g.bodyCount - g.active.reduce((s, a) => s + a, 0);
    say(`  ${String(r).padStart(3)}   ${String(g.N).padStart(9)}  ` +
        `${String(g.profile.constraints.total).padStart(11)}  ` +
        `${String(g.groups[0].ranges.length + "+" + g.groups[1].ranges.length).padStart(21)}  ` +
        `${String(cut).padStart(4)}`);
  }

  // ---- armhole closure ----
  // A hole at the shoulder is invisible to every numeric check above: the
  // capsules are right, the seam constraints are right, and the mesh still has
  // a gap you can see through, because constraints render nothing.
  {
    const g = draftShirt({ caps, res: 44, ease: 0.03 });
    const built = buildGarmentGeometry(g);
    const idx = built.geometry.index.array;
    let bridge = 0;
    const sleeveStart = g.bodyCount;
    for (let i = 0; i < idx.length; i += 3) {
      const a = idx[i], b = idx[i+1], c = idx[i+2];
      const nBody = (a < sleeveStart) + (b < sleeveStart) + (c < sleeveStart);
      if (nBody > 0 && nBody < 3) bridge++;   // spans body and sleeve
    }
    say(`
ARMHOLE CLOSURE`);
    say(`  triangles spanning body and sleeve: ${bridge}` +
        `${bridge < 8 ? "   <<< SHOULDER IS OPEN" : "   ok"}`);
  }

  for (const ease of [-0.01, 0.03, 0.09]) {
    const g = draftShirt({ caps, res: 44, ease });
    let nan = 0;
    const box = new THREE.Box3();
    const v = new THREE.Vector3();
    for (let i = 0; i < g.N; i++) {
      const x = g.pos[i * 4], y = g.pos[i * 4 + 1], z = g.pos[i * 4 + 2];
      if (!isFinite(x) || !isFinite(y) || !isFinite(z)) { nan++; continue; }
      box.expandByPoint(v.set(x, y, z));
    }
    const size = box.getSize(new THREE.Vector3());
    const cut = g.bodyCount - g.active.reduce((s, a) => s + a, 0);
    const built = buildGarmentGeometry(g);
    const tris = built.geometry.index.count / 3;
    say(`ease ${(ease * 1000).toFixed(0).padStart(3)} mm: ${g.N} particles, ` +
        `${cut} cut, ${tris} tris, ${g.sleeves.length} sleeves, ` +
        `nan=${nan}, bbox ${size.x.toFixed(2)}x${size.y.toFixed(2)}x${size.z.toFixed(2)} m`);
    if (nan) say("  <<< NaN IN GARMENT POSITIONS");
    if (!g.sleeves.length) say("  <<< NO SLEEVES BUILT");
    if (!cut) say("  <<< NO ARMHOLES CUT");
  }
  say("DONE");
} catch (e) {
  say("FAILED: " + e.stack);
}
</script>
