<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// ---- Stage 6.4: collision ----
//
// WHY CAPSULES, NOT THE MESH
// The body twin has 13,718 vertices and 27,420 triangles. Testing every cloth
// particle against every triangle, for every solver iteration, for every
// substep, is billions of tests per frame — hopeless in real time.
//
// A capsule (line segment + radius) is the standard approximation. Point-vs-
// capsule is: project the point onto the segment, clamp to its ends, measure
// the distance, push out if closer than the radius. A handful of arithmetic
// ops, no branching to speak of, and the shape genuinely fits limbs and
// torsos well because bodies ARE roughly a collection of tapered cylinders.
//
// Collision runs as a projection INSIDE the solver loop, not as a
// post-process. If you push particles out after the constraints are solved,
// the next frame's constraints pull them straight back in and the cloth
// visibly sinks into the body. Treating "stay outside the body" as just
// another constraint to satisfy is what makes it hold.

const stats = document.getElementById("stats");
const errEl = document.getElementById("err");

let device = null, gpu = null, sim = null;
let RES = 56;
const SUBSTEPS = 8, WORKGROUP = 64;
let compBend = 0.42, iterations = 8, friction = 0.55;

// ---------- capsules from the twin's skeleton ----------
// Radii are eyeballed proportions of the segment length; real garment work
// would derive them from the mesh's actual girth at each bone.
// [boneA, boneB, ownerBones, elliptical]
//
// Radii are no longer guessed — they're measured from the mesh at load (see
// measureRadii). `ownerBones` says which skinned vertices belong to this body
// part, so measuring the chest doesn't accidentally include the arms hanging
// beside it. `elliptical` marks parts whose cross-section is not round: a
// torso is markedly wider side-to-side than front-to-back, and forcing it to
// a circle is a large part of why the cloth stood off the body.
const CAPSULE_SPEC = [
  ["spine01", "neck01", ["spine01", "breast"], true],           // upper chest
  ["spine03", "spine01", ["spine02", "spine03", "breast"], true], // chest
  ["spine05", "spine03", ["spine04", "spine05"], true],         // waist
  // Hips are marked round, not elliptical: this capsule runs HORIZONTALLY,
  // so its axis is the x direction and the rx/rz convention (which assumes a
  // vertical capsule) doesn't apply. Measured as rx it came out 0.000, which
  // also made the shader divide by zero and disable hip collision entirely.
  ["upperleg01.L", "upperleg01.R", ["pelvis"], false],
  ["clavicle.L", "upperarm01.L", ["clavicle", "shoulder"], false],
  ["clavicle.R", "upperarm01.R", ["clavicle", "shoulder"], false],
  ["upperarm01.L", "lowerarm01.L", ["upperarm01.L", "upperarm02.L"], false],
  ["lowerarm01.L", "wrist.L", ["lowerarm01.L", "lowerarm02.L"], false],
  ["upperarm01.R", "lowerarm01.R", ["upperarm01.R", "upperarm02.R"], false],
  ["lowerarm01.R", "wrist.R", ["lowerarm01.R", "lowerarm02.R"], false],
  ["upperleg01.L", "lowerleg01.L", ["upperleg01.L", "upperleg02.L"], false],
  ["lowerleg01.L", "foot.L", ["lowerleg01.L", "lowerleg02.L"], false],
  ["upperleg01.R", "lowerleg01.R", ["upperleg01.R", "upperleg02.R"], false],
  ["lowerleg01.R", "foot.R", ["lowerleg01.R", "lowerleg02.R"], false],
  // owners are "neck" only: including "head" measured the skull as neck
  // girth and produced an 11 cm radius
  ["neck01", "head", ["neck"], false],
];

// High percentile, not a middling one. For a rounded cross-section most
// vertices sit at intermediate angles, so |d.x| and |d.z| are usually well
// below their semi-axes — an 80th percentile understated both (and unevenly,
// which is how the chest came out deeper than it was wide). 0.95 tracks the
// actual extent while still rejecting stray outliers.
const RADIUS_PERCENTILE = 0.95;

// Nothing should ever collide with a zero-radius capsule.
const MIN_RADIUS = 0.02;

// Capsules are an approximation, and the real mesh bulges outside them in
// places — deltoids, the chest surface, the shoulder cap. Cloth held exactly
// at the capsule surface therefore gets pierced by the body wherever that
// happens, which is what the grey patches showing through the shirt were.
// Inflating the collision radius keeps the fabric clear of the actual skin.
// Real cloth solvers do the same thing, and it doubles as a safety buffer
// against tunnelling at speed.
const COLLISION_MARGIN = 0.018;

const norm = (s) => s.replace(/[\[\]\.:\/]/g, "");
let capsules = [];      // {a: Vector3, b: Vector3, r: number}
let bodyBox = null;

// Which body part each vertex belongs to, from its dominant skin weight.
// Without this, measuring the chest's radius would sweep in the arms resting
// beside it and report a torso twice as wide as it is.
function dominantBoneNames(skinned) {
  const si = skinned.geometry.attributes.skinIndex;
  const sw = skinned.geometry.attributes.skinWeight;
  const bones = skinned.skeleton.bones;
  const out = new Array(si.count);
  for (let v = 0; v < si.count; v++) {
    let best = 0, bestW = -1;
    for (let j = 0; j < 4; j++) {
      const w = sw.getComponent(v, j);
      if (w > bestW) { bestW = w; best = si.getComponent(v, j); }
    }
    out[v] = norm(bones[best]?.name ?? "");
  }
  return out;
}

function percentile(arr, p) {
  if (!arr.length) return 0;
  arr.sort((x, y) => x - y);
  return arr[Math.min(arr.length - 1, Math.floor(arr.length * p))];
}

function buildCapsules(skinned) {
  const byName = new Map(skinned.skeleton.bones.map((b) => [norm(b.name), b]));
  const wp = (n) => {
    const b = byName.get(norm(n));
    return b ? b.getWorldPosition(new THREE.Vector3()) : null;
  };

  const owners = dominantBoneNames(skinned);
  const posAttr = skinned.geometry.attributes.position;
  const world = skinned.matrixWorld;
  const v = new THREE.Vector3();
  const ab = new THREE.Vector3();
  const ap = new THREE.Vector3();

  const out = [];
  for (const [n1, n2, ownerPrefixes, elliptical] of CAPSULE_SPEC) {
    const a = wp(n1), b = wp(n2);
    if (!a || !b) { console.warn("capsule bones missing:", n1, n2); continue; }

    ab.subVectors(b, a);
    const denom = Math.max(ab.dot(ab), 1e-9);
    const prefixes = ownerPrefixes.map(norm);

    // Distances from the axis. front/back are kept SIGNED and separate,
    // because the spine runs along the BACK of the torso rather than through
    // its centre — so a spine-based capsule sees a big forward extent and
    // almost nothing behind it. Measuring |d.z| would report nearly the full
    // torso depth as a radius. Instead we find both extents, place the axis
    // between them, and take the half-distance.
    const radial = [], sideways = [], front = [], back = [];
    for (let i = 0; i < posAttr.count; i++) {
      const owner = owners[i];
      if (!prefixes.some((p) => owner.startsWith(p))) continue;

      v.fromBufferAttribute(posAttr, i).applyMatrix4(world);
      ap.subVectors(v, a);
      const t = THREE.MathUtils.clamp(ap.dot(ab) / denom, 0, 1);
      // Skip the ends: near a joint the neighbouring part bulges in and
      // would overstate this segment's girth.
      if (t < 0.15 || t > 0.85) continue;

      const closest = ab.clone().multiplyScalar(t).add(a);
      const d = v.clone().sub(closest);
      radial.push(d.length());

      // Measure each semi-axis only from the vertices that actually lie near
      // it. Taking a percentile of |d.x| over ALL vertices mixes in the
      // front and back of the torso, where |d.x| is near zero — which
      // understates the width and is why the chest came out deeper than wide.
      const ax = Math.abs(d.x), az = Math.abs(d.z);
      if (ax > az * 2.0) sideways.push(ax);    // clearly on a side
      if (az > ax * 2.0) {                     // clearly on front or back
        if (d.z > 0) front.push(d.z); else back.push(-d.z);
      }
    }

    if (radial.length < 8) {
      console.warn(`capsule ${n1}->${n2}: only ${radial.length} owned vertices, ` +
                   `falling back to a fraction of segment length`);
      const r = Math.max(ab.length() * 0.35, MIN_RADIUS);
      out.push({ a, b, rx: r, rz: r });
      continue;
    }

    const clamp = (r) => Math.max(r, MIN_RADIUS);
    if (elliptical) {
      // Fall back to the radial estimate if a band was too sparse to trust.
      const rad = percentile(radial, RADIUS_PERCENTILE);
      const rx = clamp(sideways.length >= 8
        ? percentile(sideways, RADIUS_PERCENTILE) : rad);

      let rz = rad, dz = 0;
      if (front.length >= 8 && back.length >= 8) {
        const f = percentile(front, RADIUS_PERCENTILE);
        const bk = percentile(back, RADIUS_PERCENTILE);
        rz = (f + bk) / 2;          // half-depth, not full depth
        dz = (f - bk) / 2;          // how far the axis must move forward
      }

      // Shift the capsule forward so it sits in the middle of the torso.
      const shift = new THREE.Vector3(0, 0, dz);
      out.push({
        a: a.clone().add(shift),
        b: b.clone().add(shift),
        rx, rz: clamp(rz),
      });
    } else {
      const r = clamp(percentile(radial, RADIUS_PERCENTILE));
      out.push({ a, b, rx: r, rz: r });
    }
  }

  console.log("capsules:\n" + out.map((c, i) =>
    `  ${CAPSULE_SPEC[i][0]}->${CAPSULE_SPEC[i][1]} ` +
    `rx=${c.rx.toFixed(3)} rz=${c.rz.toFixed(3)} zShift=${(c.a.z - (wp(CAPSULE_SPEC[i][0])?.z ?? c.a.z)).toFixed(3)}`
  ).join("\n"));
  return out;
}

// ---------- cloth ----------
// Ease: how much bigger than the body the garment is cut, in metres. This is
// the single number that decides whether a size reads as tight or loose, and
// it is exactly what real pattern grading varies between sizes. Negative ease
// (garment smaller than the body) is what makes fabric strain.
//
// CAVEAT worth knowing: COLLISION_MARGIN puts a floor under effective ease.
// The cloth can never sit closer than the inflated collision surface, so ease
// below -COLLISION_MARGIN is simply absorbed and shows no extra strain. To
// demonstrate genuine tightness the margin has to come down, which trades
// against the body poking through. Real solvers resolve this with mesh or
// SDF collision instead of capsules.
let EASE = 0.025;

function garmentProfile() {
  // Cut the garment from the BODY's own measurements — the same idea a
  // pattern drafter uses. The chest capsule already told us the torso's
  // elliptical radii, so the shirt is drafted to fit rather than guessed.
  const named = {};
  CAPSULE_SPEC.forEach(([n1, n2], i) => { named[`${n1}->${n2}`] = capsules[i]; });

  const chest = named["spine03->spine01"] ?? capsules[1];
  const waist = named["spine05->spine03"] ?? capsules[2];
  const hips = named["upperleg01.L->upperleg01.R"] ?? capsules[3];
  const neck = named["neck01->head"] ?? capsules[capsules.length - 1];
  const shoulderL = named["clavicle.L->upperarm01.L"];
  const shoulderR = named["clavicle.R->upperarm01.R"];

  const yShoulder = Math.max(chest.a.y, chest.b.y);
  const yHem = hips.a.y - 0.10;              // finishes below the hip
  const yNeck = neck.a.y + 0.01;

  // Half the distance between the two shoulder joints: how far the yoke has
  // to reach sideways before it turns and runs down the body.
  const halfShoulder = shoulderL && shoulderR
    ? Math.abs(shoulderL.b.x - shoulderR.b.x) / 2
    : chest.rx * 1.35;

  return {
    cx: (chest.a.x + chest.b.x) / 2,
    cz: (chest.a.z + chest.b.z) / 2,
    yShoulder, yHem, yNeck,
    // The neck opening must clear the neck's COLLISION radius, not its
    // measured radius. Cutting it to the raw measurement made the hole
    // smaller than the thing it has to fit over, so collision ejected the
    // whole garment sideways every frame. Anything the garment must pass
    // over has to be sized against the inflated collision geometry.
    neckR: neck.rx + COLLISION_MARGIN + 0.022,
    halfShoulder,
    chestRx: chest.rx, chestRz: chest.rz,
    waistRx: waist.rx, waistRz: waist.rz,
    hipRx: hips.rx, hipRz: hips.rz,
  };
}

function buildSim() {
  // A shaped t-shirt, not a flat sheet.
  //
  // A sheet cannot fit a body: it has no neck hole to catch on the shoulders,
  // no seams to wrap, and no shaping to follow the waist. It tents over the
  // top and hangs outside the body — which is exactly what a real bedsheet
  // does too. A garment stays on because it is MECHANICALLY CAPTURED (the
  // neck hole rests on the shoulders) and fits because its dimensions are
  // drafted from the body plus an ease allowance.
  //
  // Topology is a closed tube: columns wrap around the body, rows run from
  // the neck down to the hem. The first rows form a near-horizontal yoke
  // spreading from the neck opening out to the shoulders; the rest fall
  // vertically, interpolating chest -> waist -> hip radii.
  const p = garmentProfile();
  const NCOL = RES;                        // around the body
  const NROW = Math.round(RES * 0.85);     // neck to hem
  // A broader yoke seats the shirt across both shoulders instead of balancing
  // it on a narrow cone. Without sleeves there is nothing capturing the
  // garment sideways — a real shirt is held by the arms through the sleeves —
  // so the shoulder area is doing all the work of keeping it on.
  const YOKE = Math.max(4, Math.round(NROW * 0.22));

  const N = NCOL * NROW;
  const pos = new Float32Array(N * 4);
  const idx = (c, r) => r * NCOL + ((c % NCOL) + NCOL) % NCOL;   // columns wrap

  for (let r = 0; r < NROW; r++) {
    let rx, rz, y;
    if (r < YOKE) {
      // Yoke: opens out from the neck hole to the shoulder line, dropping
      // only slightly. This is the part that catches on the shoulders.
      const t = r / YOKE;
      rx = THREE.MathUtils.lerp(p.neckR, p.halfShoulder, t);
      rz = THREE.MathUtils.lerp(p.neckR, p.chestRz + EASE, t);
      y = THREE.MathUtils.lerp(p.yNeck, p.yShoulder, t);
    } else {
      // Body: chest -> waist -> hip, so the shirt follows the torso instead
      // of hanging as a cylinder.
      const t = (r - YOKE) / (NROW - 1 - YOKE);
      const [ax, az] = t < 0.5
        ? [THREE.MathUtils.lerp(p.chestRx, p.waistRx, t * 2),
           THREE.MathUtils.lerp(p.chestRz, p.waistRz, t * 2)]
        : [THREE.MathUtils.lerp(p.waistRx, p.hipRx, (t - 0.5) * 2),
           THREE.MathUtils.lerp(p.waistRz, p.hipRz, (t - 0.5) * 2)];
      rx = ax + EASE; rz = az + EASE;
      y = THREE.MathUtils.lerp(p.yShoulder, p.yHem, t);
    }

    for (let c = 0; c < NCOL; c++) {
      const th = (c / NCOL) * Math.PI * 2;
      const i = idx(c, r);
      pos[i * 4] = p.cx + rx * Math.cos(th);
      pos[i * 4 + 1] = y;
      pos[i * 4 + 2] = p.cz + rz * Math.sin(th);
      pos[i * 4 + 3] = 1;    // nothing pinned; the neck hole holds it up
    }
  }

  const A = [], B = [], rest = [], kind = [];
  const add = (a, b, k) => {
    A.push(a); B.push(b); kind.push(k);
    rest.push(Math.hypot(
      pos[a * 4] - pos[b * 4],
      pos[a * 4 + 1] - pos[b * 4 + 1],
      pos[a * 4 + 2] - pos[b * 4 + 2]));
  };
  for (let r = 0; r < NROW; r++) {
    for (let c = 0; c < NCOL; c++) {
      // Around the body — wraps, so there is no seam to split open.
      add(idx(c, r), idx(c + 1, r), 0);
      if (r + 1 < NROW) {
        add(idx(c, r), idx(c, r + 1), 0);
        add(idx(c, r), idx(c + 1, r + 1), 0);
        add(idx(c + 1, r), idx(c, r + 1), 0);
      }
      add(idx(c, r), idx(c + 2, r), 1);
      if (r + 2 < NROW) add(idx(c, r), idx(c, r + 2), 1);
    }
  }
  const groups = [];
  for (const wantKind of [0, 1]) {
    const map = [];
    for (let k = 0; k < A.length; k++) if (kind[k] === wantKind) map.push(k);
    const sa = map.map((k) => A[k]);
    const sb = map.map((k) => B[k]);
    const { colour, numColours } = greedyColour(sa, sb, N);
    const order = map.map((_, i) => i).sort((x, y) => colour[x] - colour[y]);
    const ranges = [];
    let start = 0;
    for (let c = 0; c < numColours; c++) {
      const count = order.filter((i) => colour[i] === c).length;
      ranges.push({ start, count });
      start += count;
    }
    groups.push({
      kind: wantKind,
      a: new Uint32Array(order.map((i) => sa[i])),
      b: new Uint32Array(order.map((i) => sb[i])),
      rest: new Float32Array(order.map((i) => rest[map[i]])),
      ranges,
    });
  }
  return { N, pos, groups, idx, NCOL, NROW };
}

function greedyColour(cA, cB, numParticles) {
  const n = cA.length;
  const head = new Int32Array(numParticles).fill(-1);
  const next = new Int32Array(n * 2).fill(-1);
  const owner = new Int32Array(n * 2);
  let e = 0;
  for (let k = 0; k < n; k++) {
    for (const p of [cA[k], cB[k]]) { owner[e] = k; next[e] = head[p]; head[p] = e; e++; }
  }
  const colour = new Int32Array(n).fill(-1);
  const used = new Uint8Array(64);
  let maxColour = 0;
  for (let k = 0; k < n; k++) {
    used.fill(0);
    for (const p of [cA[k], cB[k]]) {
      for (let it = head[p]; it !== -1; it = next[it]) {
        const o = owner[it];
        if (o !== k && colour[o] >= 0) used[colour[o]] = 1;
      }
    }
    let c = 0;
    while (c < used.length && used[c]) c++;
    colour[k] = c;
    if (c > maxColour) maxColour = c;
  }
  return { colour, numColours: maxColour + 1 };
}

// ---------- shaders ----------
const SHADER = `
struct Params { dt : f32, compliance : f32, colourOffset : u32, colourCount : u32, };
struct Globals { dt : f32, gravity : f32, friction : f32, pad : f32, numParticles : u32, numCapsules : u32, };
struct Capsule { a : vec4<f32>, b : vec4<f32>, };   // a.w = radius

@group(0) @binding(0) var<storage, read_write> pos : array<vec4<f32>>;
@group(0) @binding(1) var<storage, read_write> prevPos : array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> vel : array<vec4<f32>>;
@group(0) @binding(3) var<storage, read> cA : array<u32>;
@group(0) @binding(4) var<storage, read> cB : array<u32>;
@group(0) @binding(5) var<storage, read> cRest : array<f32>;
@group(0) @binding(6) var<storage, read_write> lambda : array<f32>;
@group(0) @binding(7) var<uniform> g : Globals;
@group(0) @binding(8) var<storage, read> caps : array<Capsule>;
@group(1) @binding(0) var<uniform> p : Params;

@compute @workgroup_size(64)
fn predict(@builtin(global_invocation_id) gid : vec3<u32>) {
  let i = gid.x;
  if (i >= g.numParticles) { return; }
  let w = pos[i].w;
  if (w == 0.0) { return; }
  var v = vel[i].xyz;
  v.y = v.y + g.gravity * g.dt;
  v = v * 0.998;
  prevPos[i] = pos[i];
  pos[i] = vec4<f32>(pos[i].xyz + v * g.dt, w);
  vel[i] = vec4<f32>(v, 0.0);
}

@compute @workgroup_size(64)
fn solve(@builtin(global_invocation_id) gid : vec3<u32>) {
  if (gid.x >= p.colourCount) { return; }
  let k = gid.x + p.colourOffset;
  let a = cA[k]; let b = cB[k];
  let pa = pos[a]; let pb = pos[b];
  let wa = pa.w; let wb = pb.w;
  let wsum = wa + wb;
  if (wsum == 0.0) { return; }
  var d = pa.xyz - pb.xyz;
  let len = length(d);
  if (len < 1e-9) { return; }
  let C = len - cRest[k];
  let alpha = p.compliance / (p.dt * p.dt);
  let dl = (-C - alpha * lambda[k]) / (wsum + alpha);
  lambda[k] = lambda[k] + dl;
  let corr = d * (dl / len);
  if (wa > 0.0) { pos[a] = vec4<f32>(pa.xyz + corr * wa, wa); }
  if (wb > 0.0) { pos[b] = vec4<f32>(pb.xyz - corr * wb, wb); }
}

// Collision as a projection, run every iteration alongside the distance
// constraints. One thread per PARTICLE (not per capsule), so each particle is
// written by exactly one thread and no colouring is needed here.
@compute @workgroup_size(64)
fn collide(@builtin(global_invocation_id) gid : vec3<u32>) {
  let i = gid.x;
  if (i >= g.numParticles) { return; }
  let w = pos[i].w;
  if (w == 0.0) { return; }
  var p3 = pos[i].xyz;

  for (var c : u32 = 0u; c < g.numCapsules; c = c + 1u) {
    let cap = caps[c];
    let a = cap.a.xyz;
    let b = cap.b.xyz;
    let rx = cap.a.w;      // half-width side to side
    let rz = cap.b.w;      // half-depth front to back
    let ab = b - a;
    let denom = max(dot(ab, ab), 1e-9);
    // clamp keeps the closest point on the SEGMENT, which is what turns an
    // infinite cylinder into a capsule with rounded ends
    let t = clamp(dot(p3 - a, ab) / denom, 0.0, 1.0);
    let closest = a + ab * t;
    var d = p3 - closest;

    // Elliptical cross-section via the scaled-space trick: divide by the
    // radii so the ellipse becomes a unit circle, test there, then scale the
    // push-out back. A torso is much wider than it is deep, and treating it
    // as round is what left the cloth standing off the chest.
    let e = vec3<f32>(d.x / rx, d.y / rx, d.z / rz);
    let el = length(e);
    if (el < 1.0) {
      // Degenerate case: a particle exactly on the axis has no push-out
      // direction, so pick an arbitrary one rather than dividing by zero.
      var u = select(e / max(el, 1e-9), vec3<f32>(0.0, 0.0, 1.0), el < 1e-6);
      p3 = closest + vec3<f32>(u.x * rx, u.y * rx, u.z * rz);

      // Surface NORMAL, which on an ellipse is not the radial direction.
      // For (X/rx)^2 + (Y/rx)^2 + (Z/rz)^2 = 1 the gradient is
      // (X/rx^2, Y/rx^2, Z/rz^2), so with X = u.x*rx it reduces to
      // (u.x/rx, u.y/rx, u.z/rz). Using the radial offset instead would
      // misclassify part of the sliding motion as normal motion and let the
      // cloth creep.
      let n = normalize(vec3<f32>(u.x / rx, u.y / rx, u.z / rz)
                        + vec3<f32>(1e-9, 0.0, 0.0));

      // POSITION-based friction, applied at the moment of contact.
      // Damping velocity afterwards (as updateVel does) is too weak: by then
      // the particle has already slid. Instead, undo part of the tangential
      // displacement it made since the last substep — the component of motion
      // ALONG the surface. This is what lets cloth grip a shoulder instead of
      // sheeting off it.
      let dp = p3 - prevPos[i].xyz;
      let dpn = dot(dp, n) * n;
      let dpt = dp - dpn;
      p3 = p3 - dpt * g.friction;
    }
  }
  pos[i] = vec4<f32>(p3, w);
}

@compute @workgroup_size(64)
fn updateVel(@builtin(global_invocation_id) gid : vec3<u32>) {
  let i = gid.x;
  if (i >= g.numParticles) { return; }
  if (pos[i].w == 0.0) { return; }
  var v = (pos[i].xyz - prevPos[i].xyz) / g.dt;

  // Friction where the cloth is resting on the body: damp the component of
  // velocity ALONG the surface. Without it the sheet slides off like silk on
  // glass, which reads as wrong even when the collision itself is correct.
  for (var c : u32 = 0u; c < g.numCapsules; c = c + 1u) {
    let cap = caps[c];
    let ab = cap.b.xyz - cap.a.xyz;
    let t = clamp(dot(pos[i].xyz - cap.a.xyz, ab) / max(dot(ab, ab), 1e-9), 0.0, 1.0);
    let closest = cap.a.xyz + ab * t;
    let d = pos[i].xyz - closest;
    // same scaled-space test as collide, so contact detection agrees with
    // where the collision actually pushed particles to
    let e = vec3<f32>(d.x / cap.a.w, d.y / cap.a.w, d.z / cap.b.w);
    if (length(e) < 1.05) {
      let n = normalize(d + vec3<f32>(1e-9, 1e-9, 1e-9));
      let vn = dot(v, n) * n;
      let vt = v - vn;
      v = vn + vt * (1.0 - g.friction);
    }
  }
  vel[i] = vec4<f32>(v, 0.0);
}

@compute @workgroup_size(64)
fn clearLambda(@builtin(global_invocation_id) gid : vec3<u32>) {
  if (gid.x >= arrayLength(&lambda)) { return; }
  lambda[gid.x] = 0.0;
}
`;

const UNIFORM_STRIDE = 256;

async function initGPU() {
  if (!navigator.gpu) throw new Error("WebGPU unavailable — see webgpu-probe.html");
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error("no GPU adapter");
  device = await adapter.requestDevice();
  device.lost.then((i) => { errEl.textContent = `GPU device lost: ${i.message || i.reason}`; });
}

function createResources() {
  if (gpu) {
    for (const b of [gpu.posBuf, gpu.prevBuf, gpu.velBuf, gpu.lamBuf, gpu.globalsBuf,
                     gpu.paramsBuf, gpu.readBuf, gpu.capBuf, gpu.aBuf, gpu.bBuf, gpu.rBuf]) {
      try { b.destroy(); } catch { /* already gone */ }
    }
  }
  sim = buildSim();
  const { N, pos, groups } = sim;
  const S = GPUBufferUsage.STORAGE;
  const mk = (bytes, usage) => device.createBuffer({ size: bytes, usage });

  const posBuf = mk(pos.byteLength, S | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC);
  device.queue.writeBuffer(posBuf, 0, pos);
  const prevBuf = mk(pos.byteLength, S | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(prevBuf, 0, pos);
  const velBuf = mk(pos.byteLength, S | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(velBuf, 0, new Float32Array(N * 4));

  const totalC = groups.reduce((s, g) => s + g.a.length, 0);
  const allA = new Uint32Array(totalC), allB = new Uint32Array(totalC);
  const allR = new Float32Array(totalC);
  let off = 0;
  for (const g of groups) {
    allA.set(g.a, off); allB.set(g.b, off); allR.set(g.rest, off);
    g.base = off; off += g.a.length;
  }
  const aBuf = mk(allA.byteLength, S | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(aBuf, 0, allA);
  const bBuf = mk(allB.byteLength, S | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(bBuf, 0, allB);
  const rBuf = mk(allR.byteLength, S | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(rBuf, 0, allR);
  const lamBuf = mk(totalC * 4, S | GPUBufferUsage.COPY_DST);

  // capsules: two vec4 each, radius packed into a.w
  // a.w = rx (side to side), b.w = rz (front to back), both inflated by the
  // collision margin. The garment is still CUT to the measured radii — only
  // the collision surface is enlarged, so ease still means what it should.
  const capData = new Float32Array(capsules.length * 8);
  capsules.forEach((c, i) => {
    capData.set([c.a.x, c.a.y, c.a.z, c.rx + COLLISION_MARGIN], i * 8);
    capData.set([c.b.x, c.b.y, c.b.z, c.rz + COLLISION_MARGIN], i * 8 + 4);
  });
  const capBuf = mk(Math.max(capData.byteLength, 32), S | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(capBuf, 0, capData);

  const globalsBuf = device.createBuffer({
    size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const slots = groups.reduce((s, g) => s + g.ranges.length, 0);
  const paramsBuf = device.createBuffer({
    size: slots * UNIFORM_STRIDE,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  const module = device.createShaderModule({ code: SHADER });
  const bgl0 = device.createBindGroupLayout({
    entries: [
      ...[0, 1, 2].map((b) => ({ binding: b, visibility: GPUShaderStage.COMPUTE,
        buffer: { type: "storage" } })),
      ...[3, 4, 5].map((b) => ({ binding: b, visibility: GPUShaderStage.COMPUTE,
        buffer: { type: "read-only-storage" } })),
      { binding: 6, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
      { binding: 7, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
      { binding: 8, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
    ],
  });
  const bgl1 = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.COMPUTE,
      buffer: { type: "uniform", hasDynamicOffset: true, minBindingSize: 16 } }],
  });
  const layout = device.createPipelineLayout({ bindGroupLayouts: [bgl0, bgl1] });
  const pipe = (entryPoint) => device.createComputePipeline({
    layout, compute: { module, entryPoint } });

  const bind0 = device.createBindGroup({
    layout: bgl0,
    entries: [
      { binding: 0, resource: { buffer: posBuf } },
      { binding: 1, resource: { buffer: prevBuf } },
      { binding: 2, resource: { buffer: velBuf } },
      { binding: 3, resource: { buffer: aBuf } },
      { binding: 4, resource: { buffer: bBuf } },
      { binding: 5, resource: { buffer: rBuf } },
      { binding: 6, resource: { buffer: lamBuf } },
      { binding: 7, resource: { buffer: globalsBuf } },
      { binding: 8, resource: { buffer: capBuf } },
    ],
  });
  const bind1 = device.createBindGroup({
    layout: bgl1, entries: [{ binding: 0, resource: { buffer: paramsBuf, size: 16 } }] });

  const readBuf = device.createBuffer({
    size: pos.byteLength, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  gpu = {
    posBuf, prevBuf, velBuf, lamBuf, globalsBuf, paramsBuf, readBuf, capBuf,
    aBuf, bBuf, rBuf, bind0, bind1, totalC,
    pipelines: {
      predict: pipe("predict"), solve: pipe("solve"), collide: pipe("collide"),
      updateVel: pipe("updateVel"), clearLambda: pipe("clearLambda"),
    },
    paramsData: new ArrayBuffer(slots * UNIFORM_STRIDE),
  };
  buildRenderMesh();
}

function stepGPU(dtFrame, doReadback) {
  const dt = dtFrame / SUBSTEPS;

  const view = new DataView(gpu.paramsData);
  let slot = 0;
  for (const g of sim.groups) {
    const compliance = g.kind === 0 ? 0 : compBend;
    for (const r of g.ranges) {
      const o = slot * UNIFORM_STRIDE;
      view.setFloat32(o, dt, true);
      view.setFloat32(o + 4, compliance, true);
      view.setUint32(o + 8, g.base + r.start, true);
      view.setUint32(o + 12, r.count, true);
      r.slot = slot; slot++;
    }
  }
  device.queue.writeBuffer(gpu.paramsBuf, 0, gpu.paramsData);

  const gb = new ArrayBuffer(32); const gv = new DataView(gb);
  gv.setFloat32(0, dt, true);
  gv.setFloat32(4, -9.81, true);
  gv.setFloat32(8, friction, true);
  gv.setUint32(16, sim.N, true);
  gv.setUint32(20, capsules.length, true);
  device.queue.writeBuffer(gpu.globalsBuf, 0, gb);

  const enc = device.createCommandEncoder();
  const pGroups = Math.ceil(sim.N / WORKGROUP);
  const lGroups = Math.ceil(gpu.totalC / WORKGROUP);

  for (let s = 0; s < SUBSTEPS; s++) {
    const pass = enc.beginComputePass();
    pass.setBindGroup(0, gpu.bind0);
    pass.setBindGroup(1, gpu.bind1, [0]);

    pass.setPipeline(gpu.pipelines.clearLambda);
    pass.dispatchWorkgroups(lGroups);
    pass.setPipeline(gpu.pipelines.predict);
    pass.dispatchWorkgroups(pGroups);

    for (let it = 0; it < iterations; it++) {
      pass.setPipeline(gpu.pipelines.solve);
      for (const g of sim.groups) {
        for (const r of g.ranges) {
          if (!r.count) continue;
          pass.setBindGroup(1, gpu.bind1, [r.slot * UNIFORM_STRIDE]);
          pass.dispatchWorkgroups(Math.ceil(r.count / WORKGROUP));
        }
      }
      // Collision inside the iteration loop: pushing out once at the end
      // would let the very next constraint pass drag the cloth back inside.
      pass.setPipeline(gpu.pipelines.collide);
      pass.setBindGroup(1, gpu.bind1, [0]);
      pass.dispatchWorkgroups(pGroups);
    }

    pass.setPipeline(gpu.pipelines.updateVel);
    pass.dispatchWorkgroups(pGroups);
    pass.end();
  }

  if (doReadback) {
    enc.copyBufferToBuffer(gpu.posBuf, 0, gpu.readBuf, 0, sim.pos.byteLength);
  }
  device.queue.submit([enc.finish()]);
}

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.15);
dl.position.set(2, 4, 3);
scene.add(dl);

let bodyGroup = null, capsuleGroup = null, geometry = null, mesh = null, renderPos = null;

function buildCapsuleDebug() {
  if (capsuleGroup) scene.remove(capsuleGroup);
  capsuleGroup = new THREE.Group();
  capsuleGroup.visible = false;
  const mat = new THREE.MeshBasicMaterial({ color: 0xff5599, wireframe: true });
  for (const c of capsules) {
    const dir = c.b.clone().sub(c.a);
    const len = dir.length();
    // Built round at rx, then squashed along its own local axis to show the
    // elliptical section — so the debug view matches what the solver tests.
    const g = new THREE.CapsuleGeometry(c.rx, Math.max(len, 1e-4), 4, 10);
    const m = new THREE.Mesh(g, mat);
    m.position.copy(c.a).add(c.b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    m.scale.z = c.rz / c.rx;
    capsuleGroup.add(m);
  }
  scene.add(capsuleGroup);
}

function buildRenderMesh() {
  if (mesh) { scene.remove(mesh); geometry.dispose(); }
  geometry = new THREE.BufferGeometry();
  renderPos = new Float32Array(sim.N * 3);
  geometry.setAttribute("position", new THREE.BufferAttribute(renderPos, 3));
  // Columns wrap, so the last column joins back to the first — otherwise the
  // shirt would render with a slit down one side even though the simulation
  // is closed there.
  const tri = [];
  for (let r = 0; r < sim.NROW - 1; r++) {
    for (let c = 0; c < sim.NCOL; c++) {
      const a = sim.idx(c, r), b = sim.idx(c + 1, r);
      const d = sim.idx(c, r + 1), e = sim.idx(c + 1, r + 1);
      tri.push(a, d, b, b, d, e);
    }
  }
  geometry.setIndex(tri);
  mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
    color: 0xc94f4f, roughness: 0.8, side: THREE.DoubleSide }));
  scene.add(mesh);
}

// ---------- ui ----------
const $ = (id) => document.getElementById(id);
function syncUI() {
  compBend = $("cb").value == 0 ? 0 : Math.pow(10, -8 + $("cb").value / 12.5);
  iterations = Number($("it").value);
  friction = Number($("fr").value) / 100;
  $("cbv").textContent = compBend.toExponential(1);
  $("itv").textContent = iterations;
  $("frv").textContent = $("fr").value;
  $("rv").textContent = RES;
  $("eav").textContent = `${$("ea").value > 0 ? "+" : ""}${$("ea").value} mm`;
}
["cb", "it", "fr"].forEach((id) => $(id).addEventListener("input", syncUI));
$("res").addEventListener("change", (e) => { RES = Number(e.target.value); createResources(); syncUI(); });
$("ea").addEventListener("change", (e) => {
  // Ease changes the CUT of the garment, so the mesh has to be rebuilt — it
  // isn't a runtime parameter like compliance. This is the same distinction
  // as in real production: pattern dimensions are baked per size.
  EASE = Number(e.target.value) / 1000;
  createResources();
  syncUI();
});
$("ea").addEventListener("input", () => {
  $("eav").textContent = `${$("ea").value > 0 ? "+" : ""}${$("ea").value} mm`;
});
addEventListener("keydown", (e) => {
  if (e.key === "b" && bodyGroup) bodyGroup.visible = !bodyGroup.visible;
  if (e.key === "c" && capsuleGroup) capsuleGroup.visible = !capsuleGroup.visible;
  if (e.key === "w" && mesh) mesh.material.wireframe = !mesh.material.wireframe;
  if (e.key === " ") { createResources(); e.preventDefault(); }
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- boot ----------
let last = performance.now(), frames = 0, acc = 0, fps = 0, gpuMs = 0;

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  const t0 = performance.now();
  const doReadback = gpu.readBuf.mapState === "unmapped";
  stepGPU(dt, doReadback);
  if (doReadback) {
    const buf = gpu.readBuf, target = renderPos, geo = geometry, count = sim.N;
    buf.mapAsync(GPUMapMode.READ).then(() => {
      const src = new Float32Array(buf.getMappedRange());
      for (let i = 0; i < count; i++) {
        target[i * 3] = src[i * 4];
        target[i * 3 + 1] = src[i * 4 + 1];
        target[i * 3 + 2] = src[i * 4 + 2];
      }
      buf.unmap();
      geo.attributes.position.needsUpdate = true;
      geo.computeVertexNormals();
    }).catch(() => {});
  }
  gpuMs = gpuMs * 0.9 + (performance.now() - t0) * 0.1;

  frames++; acc += dt;
  if (acc >= 0.5) { fps = frames / acc; frames = 0; acc = 0; }
  stats.innerHTML =
    `${sim.N.toLocaleString()} particles · ${gpu.totalC.toLocaleString()} constraints<br>` +
    `${capsules.length} capsules · ${fps.toFixed(0)} fps · submit ${gpuMs.toFixed(2)} ms`;

  controls.update();
  renderer.render(scene, camera);
}

(async () => {
  try {
    await initGPU();
    const gltf = await new GLTFLoader().loadAsync("../assets/bodytwin.glb");
    let skinned = null;
    gltf.scene.traverse((o) => { if (o.isSkinnedMesh) skinned = o; });
    if (!skinned) throw new Error("no SkinnedMesh in bodytwin.glb");
    skinned.frustumCulled = false;
    skinned.material = new THREE.MeshStandardMaterial({
      color: 0x8899aa, roughness: 0.85, side: THREE.DoubleSide });

    bodyGroup = gltf.scene;
    bodyGroup.updateMatrixWorld(true);
    scene.add(bodyGroup);

    bodyBox = new THREE.Box3().setFromObject(bodyGroup);
    const c = bodyBox.getCenter(new THREE.Vector3());
    camera.position.set(c.x + 0.4, c.y + 0.35, c.z + 2.1);
    controls.target.copy(c);

    capsules = buildCapsules(skinned);
    buildCapsuleDebug();

    createResources();
    syncUI();
    frame();
  } catch (e) {
    stats.textContent = "";
    errEl.textContent = e.message;
    console.error(e);
  }
})();
</script>
