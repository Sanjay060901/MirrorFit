<div id="panel"></div>

<div id="stage">
  <video id="video" autoplay playsinline muted width="640" height="480"></video>
  <canvas id="twin" width="640" height="480"></canvas>
  <canvas id="dots" width="640" height="480"></canvas>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
import {
  createDevice, measureCapsules, poseCapsules, draftShirt,
  GarmentSim, buildGarmentGeometry, makeGarmentMaterial, norm,
} from "../lib/cloth.js";

// ============================================================================
// Stage 6.5 — the whole pipeline, live
//
// Everything built separately so far, running at once:
//
//   camera ─► MediaPipe Pose ─► One-Euro filter ─► retarget the body twin
//                                                        │
//                                    capsules follow the posed skeleton
//                                                        │
//                                       GPU XPBD cloth solves against them
//                                                        │
//                                    garment composited over the video
//
// THE ONE IDEA THAT MAKES THIS WORK: everything lives in the twin's own MODEL
// SPACE — metres, y-up, hips at the origin, and NOT mirrored. The mirror (a
// negative x scale) and the metres-to-pixels scale are applied once, by the
// parent group, at render time.
//
// That is not a tidiness preference. A negative-determinant matrix has no
// clean rotation/scale decomposition, so anything that asks for a world
// QUATERNION under the mirror gets a wrong answer — which is what produced the
// inverted-wrist bug in Stage 5.3. Positions transform through it perfectly
// well. So: simulate in model space using positions only, mirror at the end.
//
// WHAT THIS HONESTLY IS NOT:
//  - It does not remove the clothes you are already wearing. That is diminished
//    reality (segment + inpaint the background behind you), a separate and much
//    harder problem, and no phone-tier system does it convincingly.
//  - It is not 360°. One webcam cannot see your back; MediaPipe infers occluded
//    joints and its front/back depth is its weakest output. Turn past ~60° and
//    the pose degrades. The kiosk phase adds a depth camera for this.
//  - The garment is PROCEDURAL, drafted from your measurements. It behaves
//    correctly — that is real cloth physics — but it is not a photographed
//    product. Stage 7's pattern-graded assets are what make it look like a
//    specific real shirt.
// ============================================================================

const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const errEl = document.getElementById("err");
const W = 640, H = 480;
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// camera + pose model  (unchanged from Stage 5.3)
// ---------------------------------------------------------------------------

async function startCamera() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter((d) => d.kind === "videoinput");
  // Laptops with Windows Hello expose an infrared camera alongside the colour
  // one; picking it gives a black, useless feed.
  const rgb = cams.find((d) => !/ir|infrared/i.test(d.label)) ?? cams[0];

  // `ideal` rather than exact: demanding an exact resolution from a specific
  // device throws OverconstrainedError on cameras that lack that mode.
  const attempts = [];
  if (rgb) attempts.push({ deviceId: { exact: rgb.deviceId },
                           width: { ideal: W }, height: { ideal: H } });
  attempts.push({ width: { ideal: W }, height: { ideal: H }, facingMode: "user" });
  attempts.push(true);

  let stream = null, lastErr = null;
  for (const c of attempts) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: c, audio: false }); break; }
    catch (e) { lastErr = e; }
  }
  if (!stream) throw lastErr;
  video.srcObject = stream;
  await new Promise((r) => { video.onloadedmetadata = r; });
}

let landmarker;
async function loadLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numPoses: 1,
    // Silhouette widths are the only measurements that observe GIRTH, and
    // unlike anything derived from worldLandmarks they live in the image plane
    // rather than depending on MediaPipe's weak depth estimate.
    outputSegmentationMasks: true,
    minPoseDetectionConfidence: 0.3,
    minPosePresenceConfidence: 0.3,
    minTrackingConfidence: 0.3,
  });
}

// ---------------------------------------------------------------------------
// scene — pixel-perfect camera, so 1 world unit == 1 screen pixel at z = 0
// ---------------------------------------------------------------------------

const scene = new THREE.Scene();
const FOV = 60;
const camera = new THREE.PerspectiveCamera(FOV, W / H, 1, 5000);
camera.position.z = H / 2 / Math.tan(THREE.MathUtils.degToRad(FOV / 2));

const renderer = new THREE.WebGLRenderer({
  canvas: $("twin"), alpha: true, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

scene.add(new THREE.AmbientLight(0xffffff, 0.72));
const key = new THREE.DirectionalLight(0xffffff, 1.05);
key.position.set(0.4, 1.6, 2.4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.35);
rim.position.set(-1.5, 0.6, -1.4);
scene.add(rim);

// alignGroup owns placement/scale/mirror; twinModel sits inside it with the
// hips at the origin. Keeping those concerns separate means retargeting never
// has to know about screen space, and alignment never has to know about bones.
const alignGroup = new THREE.Group();
scene.add(alignGroup);

let skinned = null, twinModel = null, bodyMat = null;
let twinTorsoMetres = 0, twinShoulderMetres = 0;
const boneByName = new Map();
const restDirs = new Map();
const plan = [];

const DRIVEN = [
  ["upperarm01.L", "lowerarm01.L", 11, 13],
  ["lowerarm01.L", "wrist.L",      13, 15],
  ["upperarm01.R", "lowerarm01.R", 12, 14],
  ["lowerarm01.R", "wrist.R",      14, 16],
  ["upperleg01.L", "lowerleg01.L", 23, 25],
  ["lowerleg01.L", "foot.L",       25, 27],
  ["upperleg01.R", "lowerleg01.R", 24, 26],
  ["lowerleg01.R", "foot.R",       26, 28],
  // Hand direction is independent of the forearm's, so orienting it recovers
  // the roll a single forearm vector could never determine.
  ["wrist.L", "metacarpal1.L", 15, 19],
  ["wrist.R", "metacarpal1.R", 16, 20],
];

// Collision proxy. No LEG capsules: a t-shirt's hem stops above the hip, so
// they would only cost shader time. Every capsule here is 11 more distance
// tests per particle per iteration per substep — on integrated graphics that
// is the single biggest lever on frame rate.
const CAPSULE_SPEC = [
  { label: "chestUpper", a: "spine01", b: "neck01",
    owners: ["spine01", "breast"], elliptical: true },
  { label: "chest", a: "spine03", b: "spine01",
    owners: ["spine02", "spine03", "breast"], elliptical: true },
  { label: "waist", a: "spine04", b: "spine03",
    owners: ["spine03", "spine04"], elliptical: true },
  // Two things were wrong with the obvious "hip joint to hip joint" capsule.
  //
  // It ran HORIZONTALLY, so rx/rz — which assume a vertical capsule — measured
  // the pelvis's vertical extent instead of its width and depth, giving a blob
  // 0.246 m across on a body that is 0.146 m across. Hence the midpoint
  // endpoint, which makes the capsule vertical like every other one.
  //
  // And the owners were wrong. Checked against the mesh, spine05 dominates only
  // the inner crotch region (|x| <= 0.057) — measuring the hips from it
  // reported a 0.052 m half-width. The hip flare belongs to pelvisL/R and
  // spine04, which reach |x| = 0.150.
  { label: "hips", a: ["upperleg01.L", "upperleg01.R"], b: "spine04",
    owners: ["pelvis", "spine04"], elliptical: true },
  { label: "shoulderL", a: "clavicle.L", b: "upperarm01.L",
    owners: ["clavicle", "shoulder"], elliptical: false },
  { label: "shoulderR", a: "clavicle.R", b: "upperarm01.R",
    owners: ["clavicle", "shoulder"], elliptical: false },
  { label: "armL", a: "upperarm01.L", b: "lowerarm01.L",
    owners: ["upperarm01.L", "upperarm02.L"], elliptical: false },
  { label: "armR", a: "upperarm01.R", b: "lowerarm01.R",
    owners: ["upperarm01.R", "upperarm02.R"], elliptical: false },
  { label: "forearmL", a: "lowerarm01.L", b: "wrist.L",
    owners: ["lowerarm01.L", "lowerarm02.L"], elliptical: false },
  { label: "forearmR", a: "lowerarm01.R", b: "wrist.R",
    owners: ["lowerarm01.R", "lowerarm02.R"], elliptical: false },
  // owners is "neck" only: including "head" measures the skull as neck girth
  // and produces an 11 cm radius, which no shirt can pass over.
  { label: "neck", a: "neck01", b: "head", owners: ["neck"], elliptical: false },
];

let capsules = [];

// ---------------------------------------------------------------------------
// load the twin
// ---------------------------------------------------------------------------

new GLTFLoader().load("../assets/bodytwin.glb", (gltf) => {
  gltf.scene.traverse((o) => { if (o.isSkinnedMesh) skinned = o; });
  if (!skinned) { errEl.textContent = "no SkinnedMesh in bodytwin.glb"; return; }

  bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8fb8d8, roughness: 0.75, transparent: true, opacity: 0.35,
    // The mirroring negative x scale inverts triangle winding; without
    // DoubleSide the body would be backface-culled into invisibility.
    side: THREE.DoubleSide,
  });
  skinned.material = bodyMat;
  // Three.js derives the bounding volume from the REST pose and frustum-culls
  // against it; once retargeting moves vertices outside it the mesh silently
  // vanishes. The classic SkinnedMesh disappearing act.
  skinned.frustumCulled = false;

  twinModel = gltf.scene;
  alignGroup.add(twinModel);
  twinModel.updateMatrixWorld(true);

  const restWorld = new Map();
  for (const b of skinned.skeleton.bones) {
    // GLTFLoader runs node names through PropertyBinding.sanitizeNodeName,
    // which strips characters reserved for animation paths — including '.'.
    // Anny's "upperarm01.L" therefore arrives as "upperarm01L".
    boneByName.set(norm(b.name), b);
    restWorld.set(b, b.getWorldPosition(new THREE.Vector3()));
  }

  const boneOf = (n) => boneByName.get(norm(n));
  const mid = (a, b) => restWorld.get(boneOf(a)).clone()
    .add(restWorld.get(boneOf(b))).multiplyScalar(0.5);
  const shoulderMid = mid("upperarm01.L", "upperarm01.R");
  const hipMid = mid("upperleg01.L", "upperleg01.R");

  // Torso is a better yardstick than full height because feet and head are
  // often out of frame or poorly tracked.
  twinTorsoMetres = shoulderMid.distanceTo(hipMid);
  twinShoulderMetres = restWorld.get(boneOf("upperarm01.L"))
    .distanceTo(restWorld.get(boneOf("upperarm01.R")));
  twinModel.position.sub(hipMid);      // hips at the group origin

  // Seed a plausible scale BEFORE the first detection. 1 unit == 1 pixel here,
  // so the default scale of 1 would render a 1.6 m model about 1.6 pixels tall.
  const seed = (H * 0.25) / twinTorsoMetres;
  alignGroup.scale.set(-seed, seed, seed);

  for (const [boneName, endName, a, b] of DRIVEN) {
    const bone = boneOf(boneName), end = boneOf(endName);
    if (!bone || !end) { console.warn("missing bone", boneName, endName); continue; }
    const dir = restWorld.get(end).clone().sub(restWorld.get(bone));
    if (dir.lengthSq() < 1e-12) continue;
    restDirs.set(bone, dir.clone().normalize());
    plan.push({ bone, a, b, restLen: dir.length(), endBone: end });
  }

  twinModel.updateMatrixWorld(true);
  capsules = measureCapsules(skinned, twinModel, CAPSULE_SPEC);
  subsystems.twin = true;
  boot();
}, undefined, (e) => {
  errEl.textContent = "bodytwin.glb missing — run scripts/bodytwin/export_anny_gltf.py";
  console.error(e);
});

// ---------------------------------------------------------------------------
// shape fitting (Stage 5.4, condensed)
// ---------------------------------------------------------------------------
// Ridge-regularised least squares on measurement RATIOS. Ratios, not absolute
// lengths, because MediaPipe's landmark 11 sits on the body SURFACE near the
// acromion while Anny's upperarm01.L is the joint CENTRE inside the body —
// every absolute measurement carries that systematic offset, and fitting them
// directly made the solver blame body shape and pin every parameter at its
// clamp. Dividing through by torso length cancels it.

let fitData = null, fitApplied = false;
let userHeightCm = 0;
// DEFAULT ON, and this is a deliberate reversal.
//
// The original instruction was: no converged fit, no garment. The INTENT
// behind it was "never present a guess as a measurement" — and that intent is
// satisfied by labelling, not by hiding. Frontal RGB cannot observe girth
// through clothing, so on most real captures the fit will not converge; making
// that hide the entire try-on means the product almost never runs.
//
// So: the garment drapes on the neutral body, and the verdict banner says
// AVERAGE BUILD, size not personalised, in red. Nothing on screen claims
// accuracy we do not have. Untick the box to restore the strict behaviour.
let allowNeutral = true;
const measureSamples = [];
const FIT_FRAMES = 45;
// Measurement noise in NORMALISED ratio units. Landmark noise runs ~0.7%
// relative, and the ratios are ~0.7, so sigma is about 0.005.
const MEAS_SIGMA = 0.005;

// Prior spread for a well-observed parameter. The morphs are built so +-1
// spans roughly +-2 SD of the population, so one SD is about 0.5. This makes
// the regulariser a genuine prior rather than a knob: lambda = sigma^2/prior^2.
const PRIOR_SD = 0.5;

// Observability threshold on a parameter's weighted JtJ diagonal.
//
// Derived, not chosen by feel. The standard error of a parameter is roughly
// sigma / sqrt(diag). To pin one down to better than DELTA we need
// diag >= (sigma/DELTA)^2. Taking DELTA = 0.30 — a third of the legal range,
// beyond which an "estimate" tells you nothing useful — gives
// (0.005/0.30)^2 = 2.8e-4. Below that the prior takes over smoothly rather
// than the parameter running to its clamp.
const OBS_DELTA = 0.30;
const OBS_TAU = (MEAS_SIGMA / OBS_DELTA) ** 2;

// Kept only to report the old behaviour alongside the new one.
const RIDGE = 0.0003;
// muscle is excluded: in Anny it changes limb definition rather than girth, so
// it moves every measurement we can take by 1-2 mm and noise would pick it.
const SOLVE_PARAMS = ["gender", "weight", "height", "proportions"];
const MEASURE_DEPS = {
  shoulder_width: [11, 12], hip_width: [23, 24], upper_arm: [11, 13],
  forearm: [13, 15], thigh: [23, 25], shin: [25, 27], torso: [11, 12, 23, 24],
};
const VIS_MIN = 0.7, MAX_Z_FRACTION = 0.5;

fetch("../assets/bodyfit.json").then((r) => r.json()).then((d) => { fitData = d; })
  .catch(() => console.warn("bodyfit.json missing — shape fitting disabled"));

const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z);
const midOf = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, z: (p.z + q.z) / 2 });

// A limb pointing toward or away from the camera is FORESHORTENED, and depth
// is MediaPipe's least reliable output — so its measured 3D length comes back
// too short. With hands on hips the arms once measured 22% short, which
// dragged the height fit to its clamp.
function wellPosed(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
  const len = Math.hypot(dx, dy, dz);
  return len > 1e-4 && Math.abs(dz) / len <= MAX_Z_FRACTION;
}

// Torso widths from the segmentation mask. The arms problem: at chest height,
// arms hanging beside the body sit on the same scanline, so a plain min/max
// would measure "torso + both arms". Walking OUTWARD from the centreline and
// stopping at the first background pixel returns the contiguous body run and
// naturally excludes an arm separated by a gap.
function measureSilhouette(mask, imageLms, torsoMetres) {
  if (!mask || !fitData?.silhouetteLevels) return {};
  const w = mask.width, h = mask.height;
  const probs = mask.getAsFloat32Array();
  if (!probs || probs.length < w * h) return {};

  const sx = ((imageLms[11].x + imageLms[12].x) / 2) * w;
  const sy = ((imageLms[11].y + imageLms[12].y) / 2) * h;
  const hx = ((imageLms[23].x + imageLms[24].x) / 2) * w;
  const hy = ((imageLms[23].y + imageLms[24].y) / 2) * h;
  const torsoPx = Math.hypot(hx - sx, hy - sy);
  if (torsoPx < 8) return {};

  const out = {};
  for (const [label, t] of Object.entries(fitData.silhouetteLevels)) {
    const row = Math.round(sy + t * (hy - sy));
    const cx = Math.round(sx + t * (hx - sx));
    if (row < 0 || row >= h || cx < 1 || cx >= w - 1) continue;
    if (probs[row * w + cx] < 0.5) continue;      // centre must be on the body
    let L = cx, R = cx;
    while (L > 0 && probs[row * w + L - 1] >= 0.5) L--;
    while (R < w - 1 && probs[row * w + R + 1] >= 0.5) R++;
    // Touching a frame edge means the body is cut off: a lower bound, not a
    // measurement.
    if (L === 0 || R === w - 1) continue;
    out[`width_${label}`] = ((R - L) / torsoPx) * torsoMetres;
  }
  return out;
}

function measurePerson(w, raw) {
  const vis = (i) => (raw?.[i]?.visibility ?? 1);
  const ok = (name) => {
    const deps = MEASURE_DEPS[name];
    if (!deps.every((i) => vis(i) >= VIS_MIN)) return false;
    return deps.length === 2 ? wellPosed(w[deps[0]], w[deps[1]]) : true;
  };
  const val = {
    shoulder_width: dist(w[11], w[12]), hip_width: dist(w[23], w[24]),
    upper_arm: dist(w[11], w[13]), forearm: dist(w[13], w[15]),
    thigh: dist(w[23], w[25]), shin: dist(w[25], w[27]),
    torso: dist(midOf(w[11], w[12]), midOf(w[23], w[24])),
  };
  // null marks "not measurable this frame" rather than silently passing a
  // fabricated number into the solve.
  const out = {};
  for (const k of Object.keys(val)) out[k] = ok(k) ? val[k] : null;
  return out;
}

// Gaussian elimination with partial pivoting; n is at most 5.
function solveLin(A, b) {
  const n = b.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < n; c++) {
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-12) return null;
    [M[c], M[piv]] = [M[piv], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c] / M[c][c];
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  // Divide by the PIVOT M[i][i] — row[i] is already a number, so indexing it
  // again yields undefined and poisons everything downstream with NaN.
  return M.map((row, i) => row[n] / M[i][i]);
}

function fitShape() {
  let params = SOLVE_PARAMS.filter((p) => fitData.params.includes(p));
  // A measured stature is worth more than an inferred one: drop `height` from
  // the solve entirely rather than letting the optimiser spend it on noise.
  // Honest caveat, visible in the panel: this helps CONDITIONING (the system
  // loses its best-observed column, so the number drops) but barely moves the
  // other parameters' standard errors, because height is only ~0.37 correlated
  // with gender and ~0.41 with proportions. The genuinely collinear pair is
  // gender and proportions at 0.79.
  if (userHeightCm > 0) params = params.filter((p) => p !== "height");
  const REF = "torso";
  const avgAbs = {}, seen = {};
  for (const m of fitData.measurements) {
    const vals = measureSamples.map((x) => x[m]).filter((v) => v != null);
    seen[m] = vals.length / measureSamples.length;
    avgAbs[m] = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
  }
  if (avgAbs[REF] == null || seen[REF] < 0.5) {
    fitState = "insufficient"; fitDetail = "torso not visible"; return;
  }

  const meas = fitData.measurements.filter(
    (m) => m !== REF && avgAbs[m] != null && seen[m] >= 0.5);
  // With few measurements the solve turns arbitrary; better to keep the
  // neutral body and say so than to invent a shape from two numbers.
  if (meas.length < 3) {
    fitState = "insufficient";
    fitDetail = `only ${meas.length} usable measurements`;
    return;
  }

  const avg = {}, baseNorm = {}, jNorm = {};
  const baseRef = fitData.base[REF];
  for (const m of meas) { avg[m] = avgAbs[m] / avgAbs[REF]; baseNorm[m] = fitData.base[m] / baseRef; }
  for (const p of params) {
    const jRef = fitData.jacobian[p][REF];
    jNorm[p] = {};
    // The reference length moves too, which is exactly why this cannot be a
    // scale factor applied afterwards.
    for (const m of meas) {
      jNorm[p][m] = (fitData.base[m] + fitData.jacobian[p][m]) / (baseRef + jRef) - baseNorm[m];
    }
  }

  // Drop parameters the SURVIVING measurements cannot see. `height` gets most
  // of its signal from thigh and shin, so with the legs out of frame it is
  // nearly invisible — and solving for it anyway is how it ended up pinned
  // at -1.00.
  const diag = params.map((p) => meas.reduce((s, m) => s + jNorm[p][m] ** 2, 0));
  const strongest = Math.max(...diag);
  const keep = params.filter((_, i) => diag[i] >= strongest * 0.02);
  if (!keep.length) {
    fitState = "insufficient"; fitDetail = "no observable shape params"; return;
  }
  params.length = 0; params.push(...keep);

  const d = meas.map((m) => avg[m] - baseNorm[m]);
  const J = meas.map((m) => params.map((p) => jNorm[p][m]));
  const n = params.length;

  // WEIGHTED least squares. A measurement seen in 42% of frames is an average
  // of fewer samples AND was rejected half the time for a reason — occlusion or
  // foreshortening — so its error is both noisier and more likely biased.
  // Counting it equally with one seen in every frame is simply wrong. Weight by
  // the visible fraction, floored so a rare measurement contributes a little
  // rather than destabilising the system by vanishing.
  const wgt = meas.map((m) => Math.max(0.05, seen[m] ?? 0));

  // Per-parameter prior instead of one flat ridge. lambda = sigma^2 / prior^2,
  // and the prior tightens toward the population mean as observability falls
  // below OBS_TAU — so a parameter the data cannot see is pulled to neutral
  // smoothly, rather than being free to sprint to its clamp.
  const diagJ = params.map((_, i) =>
    J.reduce((sum, row, k) => sum + wgt[k] * row[i] * row[i], 0));
  const lambda = diagJ.map((dj) => {
    const priorSd = dj >= OBS_TAU ? PRIOR_SD : PRIOR_SD * Math.sqrt(Math.max(dj, 0) / OBS_TAU);
    return (MEAS_SIGMA * MEAS_SIGMA) / Math.max(priorSd * priorSd, 1e-9);
  });

  const A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) =>
    J.reduce((s, row, k) => s + wgt[k] * row[i] * row[j], 0) + (i === j ? lambda[i] : 0)));
  const rhs = Array.from({ length: n }, (_, i) =>
    J.reduce((s, row, k) => s + wgt[k] * row[i] * d[k], 0));

  const w = solveLin(A, rhs);
  if (!w) { fitState = "singular"; fitDetail = "normal equations singular"; return; }
  // NaN written into bone positions or morph influences corrupts the mesh
  // permanently; the failure then looks like "the twin disappeared".
  if (!w.every(Number.isFinite)) {
    fitState = "singular"; fitDetail = "non-finite solution"; return;
  }

  // Residual of the UNCLAMPED solution: how well J.w actually reproduces the
  // measurements. A tiny residual with a huge w means the system is
  // ill-conditioned, not that the fit is good — which is why saturation is
  // checked separately below rather than inferred from residual alone.
  let num = 0, den = 0;
  meas.forEach((m, k) => {
    const pred = params.reduce((a, p, i) => a + jNorm[p][m] * w[i], 0);
    num += wgt[k] * (pred - d[k]) ** 2; den += wgt[k] * d[k] ** 2;
  });
  const residual = den > 1e-12 ? Math.sqrt(num / den) : 0;

  // How far the measurements sit outside anything the morphs can express.
  // sum|J| over the legal box is the largest deviation a parameter vector can
  // produce for each measurement; a target beyond it is unreachable at ANY
  // ridge, and the solve can only respond by running to a clamp. This is the
  // number that distinguishes "noisy" from "this body is not in the model".
  const unreachable = meas.filter((m, k) => {
    const span = params.reduce((a, p) => a + Math.abs(jNorm[p][m]), 0);
    return Math.abs(d[k]) > span;
  });

  const clamped = w.map((v) => THREE.MathUtils.clamp(v, -1, 1));
  const pinned = params.filter((_, i) => Math.abs(clamped[i]) >= FIT_CLAMP_EPS);

  // Everything the solve actually saw, kept for the panel. "Show me the inputs"
  // is the only way to tell an ill-posed problem from a buggy one.
  lastFit = {
    params, raw: w, clamped, residual, pinned,
    frames: measureSamples.length,
    measurements: fitData.measurements.map((m) => ({
      name: m, avg: avgAbs[m], seen: seen[m] ?? 0, used: meas.includes(m),
    })),
    diag: params.map((p, i) => ({
      p, d: diagJ[i], value: w[i], lambda: lambda[i],
      weak: diagJ[i] < OBS_TAU,
      stderr: MEAS_SIGMA / Math.sqrt(Math.max(diagJ[i], 1e-9)),
    })),
    weights: meas.map((m, k) => ({ m, w: wgt[k] })),
    unreachable: unreachable.map((m) => m),
    heightFixed: userHeightCm > 0,
  };

  // A parameter resting exactly on its rail is the solver reporting that the
  // data does not determine it. Refuse the whole fit rather than dress up a
  // guess as a measurement.
  if (pinned.length) {
    fitState = "saturated";
    // Name the actual cause. Pinning with a LOW residual means the data is
    // ambiguous; pinning with a HIGH residual means the model cannot represent
    // this body and no amount of regularisation will change that.
    fitDetail = unreachable.length
      ? `${pinned.join(", ")} at clamp — ${unreachable.length} measurement(s) ` +
        `outside the morph range (${unreachable.join(", ")})`
      : `${pinned.join(", ")} at clamp — data doesn't determine shape`;
    return;
  }
  if (residual > FIT_MAX_RESIDUAL) {
    fitState = "insufficient";
    fitDetail = `residual ${residual.toFixed(3)} > ${FIT_MAX_RESIDUAL}`;
    return;
  }

  applyShape(params, clamped);
  fitState = "ok";
  fitDetail = `residual ${residual.toFixed(3)}, ${measureSamples.length} frames`;
}

function applyShape(params, w) {
  const dict = skinned.morphTargetDictionary;
  if (dict && skinned.morphTargetInfluences) {
    params.forEach((p, i) => {
      const idx = dict[p];
      if (idx !== undefined) skinned.morphTargetInfluences[idx] = w[i];
    });
  }
  // Morph targets only move mesh vertices, so without this the skin would
  // stretch while the skeleton kept the default body's proportions.
  if (fitData.boneDeltas && fitData.boneNames) {
    const idxOf = new Map(fitData.boneNames.map((n, i) => [norm(n), i]));
    for (const bone of skinned.skeleton.bones) {
      const i = idxOf.get(norm(bone.name));
      if (i === undefined) continue;
      let dx = 0, dy = 0, dz = 0;
      // Bone translations are LOCAL but the deltas are in model space, so a
      // child's local offset changes by (its own delta minus its parent's).
      params.forEach((p, k) => {
        const dl = fitData.boneDeltas[p]?.[i];
        if (dl) { dx += dl[0] * w[k]; dy += dl[1] * w[k]; dz += dl[2] * w[k]; }
      });
      const pi = bone.parent?.isBone ? idxOf.get(norm(bone.parent.name)) : undefined;
      if (pi !== undefined) {
        params.forEach((p, k) => {
          const pd = fitData.boneDeltas[p]?.[pi];
          if (pd) { dx -= pd[0] * w[k]; dy -= pd[1] * w[k]; dz -= pd[2] * w[k]; }
        });
      }
      bone.position.x += dx; bone.position.y += dy; bone.position.z += dz;
    }
    refreshRest();
    recentreHips();
    // The shape fit just changed the body's girth, and the capsule radii were
    // measured from the OLD mesh. Re-measure, or the shirt is drafted to
    // someone else's chest.
    twinModel.updateMatrixWorld(true);
    capsules = measureCapsules(skinned, twinModel, CAPSULE_SPEC);
  }
  fitApplied = true;
  $("fit").textContent = params.map((p, i) => `${p} ${w[i].toFixed(2)}`).join(" · ");
  console.log("shape fit:", $("fit").textContent);
}

function recentreHips() {
  const L = boneByName.get(norm("upperleg01.L")), R = boneByName.get(norm("upperleg01.R"));
  const SL = boneByName.get(norm("upperarm01.L")), SR = boneByName.get(norm("upperarm01.R"));
  if (!L || !R || !twinModel) return;
  alignGroup.updateMatrixWorld(true);
  const a = L.getWorldPosition(new THREE.Vector3());
  const b = R.getWorldPosition(new THREE.Vector3());
  // The alignment scale is torsoPixels / twinTorsoMetres, and shape fitting
  // just CHANGED the model's torso length — a stale divisor renders the twin
  // at the wrong size.
  if (SL && SR) {
    const s = Math.abs(alignGroup.scale.y) || 1;
    const shMid = SL.getWorldPosition(new THREE.Vector3())
      .add(SR.getWorldPosition(new THREE.Vector3())).multiplyScalar(0.5);
    const t = shMid.distanceTo(a.clone().add(b).multiplyScalar(0.5)) / s;
    if (t > 1e-4) twinTorsoMetres = t;
  }
  // Moving the joints also moved the hips off the group origin, and
  // alignGroup.position assumes "origin == hips".
  const hipMid = a.add(b).multiplyScalar(0.5);
  alignGroup.worldToLocal(hipMid);
  twinModel.position.sub(hipMid);
  alignGroup.updateMatrixWorld(true);
}

function refreshRest() {
  skinned.skeleton.bones.forEach((b) => { b.quaternion.identity(); b.scale.setScalar(1); });
  alignGroup.updateMatrixWorld(true);
  const world = new Map();
  for (const b of skinned.skeleton.bones) world.set(b, b.getWorldPosition(new THREE.Vector3()));
  for (const item of plan) {
    const dir = world.get(item.endBone).clone().sub(world.get(item.bone));
    if (dir.lengthSq() < 1e-12) continue;
    item.restLen = dir.length();
    restDirs.set(item.bone, dir.normalize());
  }
  lenRatio.clear();
}

// ---------------------------------------------------------------------------
// One-Euro smoothing — filter the INPUT landmarks, not the output rotations
// ---------------------------------------------------------------------------
// Filtering quaternions is fiddlier and filtering Euler angles breaks at the
// ±180° wraparound. Small positional jitter also becomes very visible angular
// jitter once you take the direction between two nearby joints.

function smoothingFactor(dt, cutoff) { const r = 2 * Math.PI * cutoff * dt; return r / (r + 1); }
class LowPassFilter {
  filter(v, a) { this.y = this.init ? a * v + (1 - a) * this.y : v; this.init = true; return this.y; }
}
class OneEuroFilter {
  constructor({ minCutoff = 1.0, beta = 0.3, dCutoff = 1.0 } = {}) {
    Object.assign(this, { minCutoff, beta, dCutoff });
    this.xf = new LowPassFilter(); this.df = new LowPassFilter();
    this.last = null; this.lastT = null;
  }
  filter(v, t) {
    if (this.lastT === null) { this.lastT = t; this.last = v; return this.xf.filter(v, 1); }
    const dt = Math.max((t - this.lastT) / 1000, 1 / 240);
    this.lastT = t;
    const dv = (v - this.last) / dt; this.last = v;
    const edv = this.df.filter(dv, smoothingFactor(dt, this.dCutoff));
    return this.xf.filter(v, smoothingFactor(dt, this.minCutoff + this.beta * Math.abs(edv)));
  }
}

const USED = [11, 12, 13, 14, 15, 16, 19, 20, 23, 24, 25, 26, 27, 28];
const worldFilters = new Map(), imageFilters = new Map();
for (const i of USED) {
  worldFilters.set(i, [0, 0, 0].map(() => new OneEuroFilter()));
  // Image landmarks are normalised 0..1, a much smaller numeric range than
  // metres, so beta has to be smaller or the filter barely engages.
  imageFilters.set(i, [0, 0, 0].map(() => new OneEuroFilter({ beta: 0.02 })));
}
function smoothLandmarks(lms, filters, t) {
  const out = {};
  for (const i of USED) {
    const f = filters.get(i), lm = lms[i];
    out[i] = { x: f[0].filter(lm.x, t), y: f[1].filter(lm.y, t), z: f[2].filter(lm.z ?? 0, t) };
  }
  return out;
}

// ---------------------------------------------------------------------------
// retargeting
// ---------------------------------------------------------------------------

const _t = new THREE.Vector3(), _pq = new THREE.Quaternion(), _q = new THREE.Quaternion();
const _a = new THREE.Vector3(), _b = new THREE.Vector3();

// MediaPipe world landmarks are y-down and z-toward-camera; Three.js is y-up.
//
// Note what is NOT done: x is not negated. Mirroring the pose DATA caused the
// twisted-wrist bug — a mirror image is a REFLECTION, and setFromUnitVectors
// below can only produce a ROTATION. No rotation turns a left arm into a right
// arm, so the limb pointed roughly right while its roll came out inverted.
// Pose anatomically; mirror the whole object at render time.
function toScene(lm, out) { return out.set(lm.x, -lm.y, -lm.z); }

// Parent rotation in MODEL space, composed from local bone quaternions.
// NOT bone.parent.getWorldQuaternion(): that runs through alignGroup's
// negative x scale, and a negative-determinant matrix has no clean
// translation/rotation/positive-scale decomposition.
function parentModelQuat(bone, out) {
  out.identity();
  const chain = [];
  for (let p = bone.parent; p && p.isBone; p = p.parent) chain.push(p);
  for (let i = chain.length - 1; i >= 0; i--) out.multiply(chain[i].quaternion);
  return out;
}
function ancestorScale(bone) {
  let s = 1;
  for (let p = bone.parent; p && p.isBone; p = p.parent) s *= p.scale.x || 1;
  return s;
}

// Limb length is a property of the person and shouldn't flicker frame to
// frame, so it gets heavy smoothing while rotation stays responsive.
const lenRatio = new Map();
const LEN_SMOOTH = 0.02;

const _left = new THREE.Vector3(), _up = new THREE.Vector3(), _front = new THREE.Vector3();
const _shMid = new THREE.Vector3(), _hpMid = new THREE.Vector3();
const _basis = new THREE.Matrix4(), _rootQ = new THREE.Quaternion();
const _l1 = new THREE.Vector3(), _l2 = new THREE.Vector3();

// Three landmarks give a full body frame: the shoulder line is one axis,
// hips→shoulders another, and their cross product is which way you face.
// Rotating the skeleton root by that frame is what lets the twin turn with you
// instead of permanently facing the camera.
//
// Rest frame of our converted model: +x = the body's LEFT, +y = up,
// +z = front (verified against Anny's toe-vs-ankle offsets).
function orientTorso(worldLms, rootBone) {
  toScene(worldLms[11], _l1); toScene(worldLms[12], _l2);
  _left.subVectors(_l1, _l2);
  if (_left.lengthSq() < 1e-8) return;
  _left.normalize();
  _shMid.addVectors(_l1, _l2).multiplyScalar(0.5);

  toScene(worldLms[23], _l1); toScene(worldLms[24], _l2);
  _hpMid.addVectors(_l1, _l2).multiplyScalar(0.5);
  _up.subVectors(_shMid, _hpMid);
  if (_up.lengthSq() < 1e-8) return;
  _up.normalize();

  // left × up = front in a right-handed frame; re-derive up afterwards so the
  // basis is orthonormal even when the shoulder and spine axes aren't exactly
  // perpendicular (on a real body they rarely are).
  _front.crossVectors(_left, _up).normalize();
  _up.crossVectors(_front, _left).normalize();
  _basis.makeBasis(_left, _up, _front);
  _rootQ.setFromRotationMatrix(_basis);
  rootBone.quaternion.slerp(_rootQ, 0.5);   // slerp, never lerp, for rotations
}

// ===========================================================================
// INPUT VALIDATION
//
// The failure this exists to stop: the app happily simulated and rendered a
// garment while the panel said "no pose", wearing a body whose shape params
// were all pinned at their clamps. Two separate holes let that happen.
//
//   1. The solver/render block was gated only on "does a garment exist", never
//      on "is the pose still valid". Once draped it kept stepping against
//      capsules frozen at whatever the last good frame left behind.
//   2. fitShape clamped its solution to +-1 and applied it regardless. A
//      parameter sitting exactly on its rail is not a measurement — it is the
//      solver saying "the data does not constrain me and I gave up". Applying
//      it silently is how you get gender 1.00, weight 1.00, height -1.00 on a
//      body that is none of those things.
//
// The rule now: a garment is only drafted, simulated and drawn when EVERY gate
// below passes, and the panel always names the gate that failed.
// ===========================================================================

const VIS_STRICT = 0.6;          // per-landmark visibility for framing
const FRAME_MARGIN = 0.03;       // normalised; landmark must clear the edge
const POSE_GRACE_FRAMES = 8;     // brief dropouts shouldn't strip the garment
const FIT_CLAMP_EPS = 0.97;      // |param| above this counts as saturated
const FIT_MAX_RESIDUAL = 0.09;   // relative; above this the fit didn't converge

// Framing has TWO tiers, and conflating them is what hid the working garment.
//
// To DRAPE a shirt we need the torso: shoulders and hips, nothing else. To FIT
// body shape we need the whole body, because thigh and shin carry the largest
// Jacobian entries for `height` — cropping them is precisely what drives that
// parameter into its clamp.
//
// Requiring the second for the first meant someone sitting at a desk, whose
// torso is tracked perfectly, was shown nothing at all. Same mistake as
// blocking the garment on the shape fit, one layer up.
const FRAME_REQUIRED = [
  { key: "shoulders", idx: [11, 12], label: "shoulders", tier: "garment" },
  // Hips are PREFERRED, not required. They give the torso's length and
  // direction directly; without them we fall back to shoulder width times an
  // anthropometric ratio, which is an approximation to PLACEMENT — visibly
  // wrong if it is wrong — not a claim about the wearer's measurements. A
  // seated user at a desk has their hips below the frame, and refusing to show
  // anything to that user was not a defensible reading of "validate inputs".
  { key: "hips",      idx: [23, 24], label: "hips",      tier: "placement" },
  { key: "head",      idx: [0],      label: "head",      tier: "fit" },
  { key: "knees",     idx: [25, 26], label: "knees",     tier: "fit" },
  { key: "ankles",    idx: [27, 28], label: "ankles",    tier: "fit" },
];
let fullBodyFramed = false;
let hipsVisible = false;

let framesSincePose = 9999;
let fitState = "waiting";        // waiting|collecting|insufficient|saturated|singular|ok
let fitDetail = "no pose yet";
let lastFit = null;              // full record of what the solve actually saw
let framingReport = [];
let gates = [{ key: "pose", label: "pose detected", ok: false, detail: "starting" }];
let ready = false;

function evaluateGates(imageLms, rawLms) {
  const out = [];

  // --- pose ---
  out.push({
    key: "pose", label: "pose detected",
    ok: framesSincePose <= POSE_GRACE_FRAMES,
    detail: framesSincePose === 0 ? "this frame"
      : framesSincePose > 900 ? "never" : `${framesSincePose} frames ago`,
  });

  // --- framing ---
  framingReport = [];
  let framingOk = Boolean(imageLms && rawLms);
  if (imageLms && rawLms) {
    for (const part of FRAME_REQUIRED) {
      let inFrame = true, seen = true;
      for (const i of part.idx) {
        const lm = imageLms[i], rw = rawLms[i];
        if (!lm) { inFrame = false; seen = false; continue; }
        if (lm.x < FRAME_MARGIN || lm.x > 1 - FRAME_MARGIN ||
            lm.y < FRAME_MARGIN || lm.y > 1 - FRAME_MARGIN) inFrame = false;
        if ((rw?.visibility ?? 0) < VIS_STRICT) seen = false;
      }
      const ok = inFrame && seen;
      framingReport.push({ ...part, ok,
        why: !inFrame ? "out of frame" : !seen ? "not visible" : "" });
      if (!ok) framingOk = false;
    }
  } else {
    for (const part of FRAME_REQUIRED) framingReport.push({ ...part, ok: false, why: "no pose" });
  }
  fullBodyFramed = framingOk;
  const torsoParts = framingReport.filter((f) => f.tier === "garment");
  const torsoOk = torsoParts.every((f) => f.ok);
  hipsVisible = framingReport.find((f) => f.key === "hips")?.ok ?? false;
  const missingTorso = torsoParts.filter((f) => !f.ok)
    .map((f) => `${f.label} (${f.why})`);
  out.push({
    key: "framing", label: "shoulders in frame", ok: torsoOk,
    detail: !torsoOk ? `missing: ${missingTorso.join(", ")}`
      : framingOk ? "full body visible"
      : hipsVisible ? "torso only — enough to drape"
      : "shoulders only — placement estimated from shoulder width",
  });

  // --- confidence ---
  let conf = 0;
  if (rawLms) {
    const core = [11, 12, 23, 24];
    conf = core.reduce((a, i) => a + (rawLms[i]?.visibility ?? 0), 0) / core.length;
  }
  // 0.75 was too strict in practice: MediaPipe reports lower visibility for a
  // seated body whose hips sit behind a desk, even though the landmarks are
  // perfectly usable for placing a garment. 0.55 still rejects an empty room
  // (which scores near zero) without rejecting a real person at a desk.
  out.push({
    key: "confidence", label: "landmark confidence", ok: conf >= 0.55,
    detail: `${conf.toFixed(2)} (need 0.55)`,
  });

  // --- fit ---
  // With no bodyfit.json there is nothing to converge, so the gate would block
  // forever on a condition the user cannot act on. Neutral body, gate open,
  // and the panel says so.
  // Two different questions, deliberately separated.
  //
  // "Can we draft and drape a garment?" depends on the CAPSULES, which are
  // measured off the mesh and are correct whatever the morphs say. "Can we
  // claim this size is right for you?" depends on the shape fit. Blocking the
  // first on the second means a working try-on is hidden because we could not
  // determine the wearer's build — which is a stricter rule than the product
  // needs, and stricter than the honest claim requires.
  //
  // Default stays as specified: no fit, no garment. With the override the
  // garment drapes on the NEUTRAL body and every fit-derived claim is labelled
  // unpersonalised, so nothing on screen implies accuracy we do not have.
  const fitOk = fitState === "ok" || !fitData;
  const legsMissing = framingReport.filter((f) => f.tier === "fit" && !f.ok)
    .map((f) => f.label);
  out.push({
    key: "fit", label: "shape fit converged",
    ok: fitOk || allowNeutral,
    detail: !fitData ? "no bodyfit.json — neutral body"
      : fitOk ? fitDetail
      : legsMissing.length
        ? `needs ${legsMissing.join(", ")} in frame` +
          (allowNeutral ? " — using average build" : "")
      : `${fitDetail}${allowNeutral ? " — using average build" : ""}`,
  });

  return out;
}

const RETARGET_VIS_MIN = 0.5;

function retarget(worldLms, raw) {
  // Root first: limb targets are converted through parentModelQuat, which
  // walks up through the root, so torso orientation must be final before any
  // limb is solved.
  const root = skinned?.skeleton?.bones?.[0];
  if (root) orientTorso(worldLms, root);
  const vis = (i) => (raw?.[i]?.visibility ?? 1);

  for (const { bone, a, b, restLen } of plan) {
    // Hold the last good pose for bones whose landmarks the model isn't
    // confident about. Driving a bone from a guessed landmark produces a wild
    // rotation that reads as the limb spasming — worse than it not moving.
    if (vis(a) < RETARGET_VIS_MIN || vis(b) < RETARGET_VIS_MIN) continue;
    toScene(worldLms[a], _a); toScene(worldLms[b], _b);
    _t.subVectors(_b, _a);
    const measured = _t.length();
    if (measured < 1e-4) continue;
    _t.divideScalar(measured);

    // DRIVEN is ordered parent-before-child, so a child's parent local
    // quaternion is already final for this frame.
    parentModelQuat(bone, _pq);
    _t.applyQuaternion(_pq.invert());
    _q.setFromUnitVectors(restDirs.get(bone), _t);
    bone.quaternion.copy(_q);

    // Stretch the bone so its segment matches the wearer's. Clamped because a
    // badly-tracked frame would otherwise produce a grotesque limb.
    const rawRatio = THREE.MathUtils.clamp(measured / restLen, 0.6, 1.6);
    const prev = lenRatio.get(bone);
    const s = prev === undefined ? rawRatio : prev + (rawRatio - prev) * LEN_SMOOTH;
    lenRatio.set(bone, s);
    // Children inherit this scale, so divide out the ACCUMULATED ancestor
    // scale to stop ratios compounding — not the immediate parent's, since
    // above lowerarm01 sits the undriven twist bone upperarm02.
    bone.scale.setScalar(s / ancestorScale(bone));
  }
}

// ---------------------------------------------------------------------------
// screen alignment (image landmarks — these ARE camera-relative, which is
// exactly what overlaying needs; worldLandmarks would give metres-from-hip
// with no idea where you are in frame)
// ---------------------------------------------------------------------------

const SMOOTH = 0.6;
let smoothScale = 0, smoothX = 0, smoothY = 0, haveAlign = false;
const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
const _sh = new THREE.Vector3(), _hp = new THREE.Vector3();

// Mirrored to match the CSS-flipped video, then into pixel-world coords.
function pix(lm, out) { return out.set((0.5 - lm.x) * W, -(lm.y - 0.5) * H, 0); }

function align(lms) {
  if (!twinTorsoMetres) return;
  _sh.copy(pix(lms[11], _p1)).add(pix(lms[12], _p2)).multiplyScalar(0.5);

  let torsoPx, scale;
  if (hipsVisible) {
    _hp.copy(pix(lms[23], _p1)).add(pix(lms[24], _p2)).multiplyScalar(0.5);
    torsoPx = _sh.distanceTo(_hp);
    if (torsoPx < 1) return;
    scale = torsoPx / twinTorsoMetres;       // metres → pixels, here and now
  } else {
    // Hips below the frame. Shoulder WIDTH is still fully visible and is a
    // rigid bony span, so it makes a better scale reference than anything
    // inferred vertically. Torso length then follows from the twin's own
    // shoulder-to-torso proportion rather than a population average — the
    // model already encodes that ratio, so we may as well use its version.
    const shoulderPx = pix(lms[11], _p1).distanceTo(pix(lms[12], _p2));
    if (shoulderPx < 1 || !twinShoulderMetres) return;
    scale = shoulderPx / twinShoulderMetres;
    torsoPx = twinTorsoMetres * scale;
    // Straight down the screen: correct for an upright seated person, and the
    // error is plainly visible rather than hidden in a number.
    _hp.set(_sh.x, _sh.y - torsoPx, 0);
  }

  if (!haveAlign) { smoothScale = scale; smoothX = _hp.x; smoothY = _hp.y; haveAlign = true; }
  else {
    smoothScale += (scale - smoothScale) * SMOOTH;
    smoothX += (_hp.x - smoothX) * SMOOTH;
    smoothY += (_hp.y - smoothY) * SMOOTH;
  }
  alignGroup.position.set(smoothX, smoothY, 0);
  // Negative x: mirror the whole twin so it reads like a mirror against the
  // CSS-flipped video, while the bones underneath stay anatomically correct.
  // Roll is NOT applied here — orientTorso already contains lean, and applying
  // a screen-space roll on top would double-count it.
  alignGroup.scale.set(-smoothScale, smoothScale, smoothScale);
}

// ---------------------------------------------------------------------------
// the garment
// ---------------------------------------------------------------------------

let device = null, sim = null, garmentMesh = null, renderPos = null;
let garmentColour = 0xc94f4f;
let ease = 0.030, res = 72;
let trackedFrames = 0, autoDraped = false;
let draftProfile = null, steppingLastFrame = false;
let lastImageLms = null, lastRawLms = null;

// The twin's live body frame, in model space. Derived from bone POSITIONS
// rather than a world quaternion, so it stays correct under the mirror.
const _bfL = new THREE.Vector3(1, 0, 0);
const _bfU = new THREE.Vector3(0, 1, 0);
const _bfF = new THREE.Vector3(0, 0, 1);
const FRAME = { left: _bfL, up: _bfU, front: _bfF };
function bodyFrame() {
  const P = (n) => {
    const bone = boneByName.get(norm(n));
    return bone ? twinModel.worldToLocal(bone.getWorldPosition(new THREE.Vector3())) : null;
  };
  const sl = P("upperarm01.L"), sr = P("upperarm01.R");
  const hl = P("upperleg01.L"), hr = P("upperleg01.R");
  // Fall back to the identity frame rather than producing NaNs: a NaN capsule
  // silently disables collision and the shirt falls through the floor.
  if (!sl || !sr || !hl || !hr) return FRAME;
  _bfL.subVectors(sl, sr).normalize();
  _bfU.copy(sl).add(sr).multiplyScalar(0.5)
      .sub(hl.add(hr).multiplyScalar(0.5)).normalize();
  _bfF.crossVectors(_bfL, _bfU).normalize();
  _bfU.crossVectors(_bfF, _bfL).normalize();
  return FRAME;
}

function drape() {
  if (!device || !twinModel || !capsules.length) return;
  try {
    twinModel.updateMatrixWorld(true);
    poseCapsules(capsules, twinModel, bodyFrame(), 0);

    const drafted = draftShirt({ caps: capsules, res, ease });
    draftProfile = drafted.profile;
    if (!sim) sim = new GarmentSim(device, { substeps: 6 });
    sim.spawn(drafted, capsules.length);
    sim.iterations = 6;
    syncUI();

    if (garmentMesh) { twinModel.remove(garmentMesh); garmentMesh.geometry.dispose(); }
    const built = buildGarmentGeometry(drafted);
    renderPos = built.renderPos;
    garmentMesh = new THREE.Mesh(built.geometry, makeGarmentMaterial(garmentColour));
    // Child of twinModel, so it inherits the hip offset, the metres→pixels
    // scale AND the mirror — exactly the same transform chain the body gets.
    twinModel.add(garmentMesh);
    autoDraped = true;
    errEl.textContent = "";
  } catch (e) {
    errEl.textContent = `drape failed: ${e.message}`;
    console.error(e);
  }
}

// ---------------------------------------------------------------------------
// ui
// ---------------------------------------------------------------------------

function syncUI() {
  // Bend compliance spans many orders of magnitude, so the slider is
  // logarithmic: 0 = a board, 100 = a silk scarf.
  const bendVal = Number($("bend").value);
  const compliance = bendVal === 0 ? 0 : Math.pow(10, -8 + bendVal / 12.5);
  if (sim) { sim.bendCompliance = compliance; sim.friction = Number($("fric").value) / 100; }
  $("bendv").textContent = compliance ? compliance.toExponential(0) : "rigid";
  $("fricv").textContent = $("fric").value;
  $("resv").textContent = res;
  $("easev").textContent = `${ease >= 0 ? "+" : ""}${Math.round(ease * 1000)}`;
}
["bend", "fric"].forEach((id) => $(id).addEventListener("input", syncUI));
$("ease").addEventListener("input", () => {
  $("easev").textContent = `${$("ease").value > 0 ? "+" : ""}${$("ease").value}`;
});
// Ease and resolution change the CUT of the garment, so the mesh must be
// rebuilt — they are not runtime parameters like compliance. Same distinction
// as in real production: pattern dimensions are baked per size.
$("ease").addEventListener("change", (e) => { ease = Number(e.target.value) / 1000; drape(); });
$("res").addEventListener("change", (e) => { res = Number(e.target.value); drape(); });
$("drape").addEventListener("click", () => {
  // Silently building a garment that is then hidden by a gate is the worst of
  // both: the user pressed a button and nothing happened, with no reason given.
  if (!ready) {
    const b = gates.find((g) => !g.ok);
    errEl.textContent = `can't drape yet — ${b ? b.label + ": " + b.detail : "starting up"}`;
    return;
  }
  drape();
});
$("allowNeutral").addEventListener("change", (e) => {
  allowNeutral = e.target.checked;
  if (!allowNeutral && fitState !== "ok") autoDraped = false;
});
$("applyHeight").addEventListener("click", () => {
  const v = Number($("height").value);
  userHeightCm = v >= 120 && v <= 220 ? v : 0;
  // Re-run the capture: the parameter set changed, so the old solve no longer
  // describes the system we are now solving.
  measureSamples.length = 0;
  fitApplied = false;
  fitState = "waiting";
  fitDetail = userHeightCm ? `height fixed at ${userHeightCm} cm` : "height not set";
});
$("vop").addEventListener("input", (e) => { video.style.opacity = String(e.target.value / 100); });

document.querySelectorAll(".sw").forEach((el) => el.addEventListener("click", () => {
  garmentColour = parseInt(el.dataset.c, 16);
  if (garmentMesh) garmentMesh.material.color.setHex(garmentColour);
}));

$("bodymode").addEventListener("change", (e) => setBodyMode(e.target.value));
function setBodyMode(mode) {
  if (!bodyMat || !skinned) return;
  skinned.visible = mode !== "off";

  // "occlude": the body writes DEPTH but no colour. That is the standard AR
  // occlusion trick, and it is what lets an arm crossing in front of your
  // chest hide the shirt behind it. Without it the garment always draws on
  // top, because the video plane carries no depth information at all.
  //
  // The subtlety is the RENDER PASS. Three.js draws all opaque objects first,
  // then all transparent ones, and renderOrder only sorts WITHIN a pass. Left
  // transparent, the occluder would be drawn after the (opaque) garment and
  // have nothing to occlude. So the occluder must be opaque — it writes no
  // colour anyway, which is precisely why that is free.
  bodyMat.colorWrite = mode !== "occlude";
  bodyMat.transparent = mode === "ghost";
  bodyMat.opacity = mode === "ghost" ? 0.32 : 1.0;
  bodyMat.depthWrite = true;
  bodyMat.needsUpdate = true;
  // Depth-only pass must run BEFORE the garment or it has nothing to test
  // against; the ghost is a look, so it goes last and blends over the top.
  skinned.renderOrder = mode === "ghost" ? 1 : -1;
}

let showDots = false;
addEventListener("keydown", (e) => {
  if (e.key === " ") { drape(); e.preventDefault(); }
  if (e.key === "d") showDots = !showDots;
  if (e.key === "p") panelOn = !panelOn;
  if (e.key === "w" && garmentMesh) {
    garmentMesh.material.wireframe = !garmentMesh.material.wireframe;
  }
});

const dotsCtx = $("dots").getContext("2d");
// Independent of the twin entirely: if dots appear, MediaPipe sees you and any
// remaining problem is in the twin's maths. If no dots, it's detection or
// framing. Separating those two failure modes is the whole point.
function drawDots(lms) {
  if (!lms) return;
  dotsCtx.fillStyle = "#ff3355";
  for (const lm of lms) {
    dotsCtx.beginPath();
    dotsCtx.arc((1 - lm.x) * W, lm.y * H, 3, 0, Math.PI * 2);
    dotsCtx.fill();
  }
}

// ---------------------------------------------------------------------------
// framing coach
// ---------------------------------------------------------------------------
// Telling someone "insufficient input" is useless; they cannot act on it. The
// coach shows the target region, ticks off each body part as it comes into
// frame, and gives ONE instruction — the most useful next move, not a list.
function drawCoach(imageLms) {
  const pad = 0.055;
  const x0 = pad * W, y0 = pad * H, x1 = (1 - pad) * W, y1 = (1 - pad) * H;

  dotsCtx.save();
  dotsCtx.setLineDash([9, 7]);
  dotsCtx.lineWidth = 2;
  dotsCtx.strokeStyle = ready ? "rgba(110,220,130,.85)" : "rgba(255,170,60,.85)";
  dotsCtx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  dotsCtx.setLineDash([]);

  // Per-part checklist down the left edge.
  dotsCtx.font = "600 12px ui-monospace, Consolas, monospace";
  let ty = y0 + 16;
  for (const f of framingReport) {
    // Amber, not red, for the fit-only requirements: missing legs costs you a
    // personalised size, not the try-on itself.
    dotsCtx.fillStyle = f.ok ? "#6de08a" : (f.tier === "garment" ? "#ff6b6b" : "#ffb347");
    dotsCtx.fillText(`${f.ok ? "\u2713" : "\u2717"} ${f.label}` +
                     (f.tier === "fit" && !f.ok ? "  (size only)" : ""), x0 + 8, ty);
    ty += 16;
  }

  // Distance hint from torso height in pixels: too small means step forward,
  // too large means the frame cannot contain the legs.
  let hint = "";
  if (!imageLms) {
    hint = "step into view";
  } else {
    const missing = framingReport.filter((f) => !f.ok);
    const torsoPx = Math.abs(((imageLms[23].y + imageLms[24].y) / 2 -
                              (imageLms[11].y + imageLms[12].y) / 2) * H);
    if (missing.some((m) => m.tier === "garment")) {
      hint = "turn to face the camera, shoulders and hips in view";
    } else if (missing.some((m) => m.key === "ankles" || m.key === "knees")) {
      hint = "step back so your legs are in frame for a personalised size";
    } else if (missing.some((m) => m.key === "head")) {
      hint = "step back or tilt the camera up";
    } else if (torsoPx < H * 0.16) {
      hint = "step closer";
    } else if (missing.length) {
      hint = `turn to face the camera (${missing.map((m) => m.label).join(", ")})`;
    } else if (fitState === "saturated" || fitState === "insufficient") {
      hint = "hold still, arms slightly out";
    } else if (fitState === "collecting") {
      hint = "hold still\u2026";
    }
  }

  if (hint) {
    dotsCtx.font = "600 17px system-ui, sans-serif";
    const w = dotsCtx.measureText(hint).width;
    dotsCtx.fillStyle = "rgba(0,0,0,.66)";
    dotsCtx.fillRect(W / 2 - w / 2 - 14, y1 - 44, w + 28, 32);
    dotsCtx.fillStyle = "#ffd9a0";
    dotsCtx.textAlign = "center";
    dotsCtx.fillText(hint, W / 2, y1 - 22);
    dotsCtx.textAlign = "left";
  }
  dotsCtx.restore();
}

// ---------------------------------------------------------------------------
// debug panel, grouped by pipeline stage
// ---------------------------------------------------------------------------
let panelOn = true;
const panelEl = $("panel");
const fmt = (v, n = 3) => (v == null || !isFinite(v) ? "\u2014" : v.toFixed(n));

function renderPanel() {
  if (!panelOn) { panelEl.style.display = "none"; return; }
  panelEl.style.display = "block";

  const h = [];
  const blocked = gates.filter((g) => !g.ok);
  h.push(`<div id="verdict" class="${ready ? "ok" : "no"}">` +
         `${ready ? "READY \u2014 garment live" : "BLOCKED: " + blocked[0].label}</div>`);

  h.push("<h4>gates</h4>");
  for (const g of gates) {
    h.push(`<div class="row"><span class="${g.ok ? "pass" : "fail"}">` +
           `${g.ok ? "\u2713" : "\u2717"} ${g.label}</span><span>${g.detail}</span></div>`);
  }

  h.push("<h4>tracking</h4>");
  h.push(row("frames since pose", framesSincePose > 900 ? "never" : framesSincePose));
  h.push(row("px per metre", haveAlign ? smoothScale.toFixed(0) : "\u2014"));
  h.push(row("bones driven", `${plan.length}/${DRIVEN.length}`));

  h.push("<h4>fitting</h4>");
  h.push(row("state", fitState));
  h.push(row("detail", fitDetail));
  h.push(row("samples", `${measureSamples.length}/${FIT_FRAMES}`));
  if (lastFit) {
    h.push(row("residual", fmt(lastFit.residual)));
    if (lastFit.unreachable?.length) {
      h.push(`<div class="row"><span class="fail">unreachable</span>` +
             `<span>${lastFit.unreachable.join(", ")}</span></div>`);
      h.push(`<div class="row"><span class="fail">\u2192 outside morph range</span>` +
             `<span>model can't express this body</span></div>`);
    }
    h.push(row("height", lastFit.heightFixed ? "fixed by user" : "solved"));
    for (const d of lastFit.diag) {
      const pin = Math.abs(THREE.MathUtils.clamp(d.value, -1, 1)) >= FIT_CLAMP_EPS;
      h.push(`<div class="row"><span class="${d.weak ? "wait" : ""}">${d.p}</span>` +
             `<span class="${pin ? "fail" : ""}">${fmt(d.value, 2)}${pin ? " PINNED" : ""} ` +
             `\u00b1${fmt(d.stderr, 2)} (J\u1d40J ${fmt(d.d, 4)}, \u03bb ${d.lambda.toExponential(0)})` +
             `</span></div>`);
    }
    h.push("<h4>fit inputs</h4>");
    for (const m of lastFit.measurements) {
      const wt = lastFit.weights?.find((x) => x.m === m.name);
      h.push(`<div class="row"><span class="${m.used ? "pass" : "fail"}">${m.name}</span>` +
             `<span>${m.avg == null ? "\u2014" : (m.avg * 100).toFixed(1) + " cm"} ` +
             `seen ${(m.seen * 100).toFixed(0)}%` +
             `${wt ? ` w=${wt.w.toFixed(2)}` : ""}</span></div>`);
    }
  }

  h.push("<h4>capsules</h4>");
  if (!capsules.length) h.push(row("state", "not measured"));
  else {
    const round = capsules.filter((c) => c.elliptical && Math.abs(c.rx - c.rz) < 1e-6);
    h.push(row("count", capsules.length));
    h.push(`<div class="row"><span>elliptical fallback</span>` +
           `<span class="${round.length ? "fail" : "pass"}">` +
           `${round.length ? round.map((c) => c.label).join(",") : "none"}</span></div>`);
    for (const c of ["chest", "waist", "hips"]) {
      const cap = capsules.find((x) => x.label === c);
      if (cap) h.push(row(c, `rx ${fmt(cap.rx)} rz ${fmt(cap.rz)}`));
    }
  }

  h.push("<h4>drafting</h4>");
  if (!draftProfile) h.push(row("state", "not drafted"));
  else {
    const pr = draftProfile;
    const gap = (pr.shoulderJointHeight - pr.shoulderRingHeight) * 1000;
    h.push(`<div class="row"><span>yoke vs shoulders</span>` +
           `<span class="${Math.abs(gap) < 20 ? "pass" : "fail"}">${gap.toFixed(0)} mm</span></div>`);
    h.push(row("neck circum", `${(pr.neckCircum * 100).toFixed(1)} cm`));
    h.push(row("chest body\u2192garment",
               `${(pr.chestRx * 100).toFixed(1)} \u2192 ${((pr.chestRx + pr.ease) * 100).toFixed(1)} cm`));
    h.push(row("waist body\u2192garment",
               `${(pr.waistRx * 100).toFixed(1)} \u2192 ${((pr.waistRx + pr.ease) * 100).toFixed(1)} cm`));
    h.push(row("hips body\u2192garment",
               `${(pr.hipRx * 100).toFixed(1)} \u2192 ${((pr.hipRx + pr.ease) * 100).toFixed(1)} cm`));
    h.push(row("length ratio",
               `${fmt(pr.lengthRatio, 2)} (spec ${fmt(pr.targetLengthRatio, 2)})`));
    h.push(`<div class="row"><span>seam stitches</span>` +
           `<span class="${pr.seam.maxRest < 0.02 ? "pass" : "fail"}">` +
           `${pr.seam.count} @ max ${(pr.seam.maxRest * 1000).toFixed(0)} mm</span></div>`);
    if (pr.degraded?.length) {
      for (const d of pr.degraded) h.push(`<div class="row"><span class="fail">DEGRADED</span><span>${d}</span></div>`);
    }
  }

  h.push("<h4>solver</h4>");
  if (!sim?.sim) h.push(row("state", "not spawned"));
  else {
    h.push(row("fps", fps.toFixed(0)));
    h.push(row("solve", `${solveMs.toFixed(2)} ms`));
    h.push(row("particles", sim.sim.N));
    h.push(row("constraints", sim.gpu.totalC));
    h.push(row("stepping", steppingLastFrame ? "yes" : "HALTED (gated)"));
  }

  panelEl.innerHTML = h.join("");
}
function row(k, v) { return `<div class="row"><span>${k}</span><span>${v}</span></div>`; }

// ---------------------------------------------------------------------------
// loop
// ---------------------------------------------------------------------------

const subsystems = { twin: false, gpu: false, pose: false };
let started = false;
function boot() {
  if (started || !subsystems.twin || !subsystems.gpu || !subsystems.pose) return;
  started = true;
  setBodyMode($("bodymode").value);
  syncUI();
  loop();
}

let lastVideoTime = -1, lastFrame = performance.now(), lastPose = 0;
let fps = 0, frames = 0, acc = 0, solveMs = 0, lastPanel = 0;

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  // Clamp: a long stall (tab backgrounded, GC pause) would otherwise inject a
  // huge dt and blow the solver up.
  const dt = Math.min((now - lastFrame) / 1000, 1 / 25);
  lastFrame = now;

  let detected = false;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res2 = landmarker.detectForVideo(video, now);
    detected = Boolean(res2.worldLandmarks?.length && res2.landmarks?.length);

    framesSincePose = detected ? 0 : framesSincePose + 1;
    lastImageLms = detected ? res2.landmarks[0] : null;
    lastRawLms = detected ? res2.worldLandmarks[0] : null;

    // Gates are evaluated BEFORE anything consumes the landmarks, so no stage
    // can act on input that has already been judged unusable.
    gates = evaluateGates(lastImageLms, lastRawLms);
    const confOk = gates.find((g) => g.key === "confidence").ok;
    ready = gates.every((g) => g.ok);

    if (detected && plan.length) {
      const sw = smoothLandmarks(res2.worldLandmarks[0], worldFilters, now);

      // Collect measurements ONLY while the body is properly framed and
      // confidently tracked. Previously any detected pose fed the solver,
      // including one with the legs cropped — and thigh and shin carry the
      // largest Jacobian entries for `height`, so cropping them is exactly what
      // drove that parameter to its clamp. Sampling a badly framed body and
      // then regularising the result is not robustness, it is laundering.
      if (fitData && !fitApplied && skinned) {
        if (fullBodyFramed && confOk) {
          const sample = measurePerson(sw, res2.worldLandmarks[0]);
          const mask = res2.segmentationMasks?.[0];
          if (mask && sample.torso) {
            Object.assign(sample, measureSilhouette(mask, res2.landmarks[0], sample.torso));
          }
          measureSamples.push(sample);
          if (fitState !== "ok") {
            fitState = "collecting";
            fitDetail = `${measureSamples.length}/${FIT_FRAMES} frames`;
          }
          if (measureSamples.length >= FIT_FRAMES) {
            fitShape();
            // Always clear. If the fit bailed we must start a fresh window
            // rather than re-solving the same stale samples every frame — that
            // is what once produced 244 repeated attempts.
            measureSamples.length = 0;
          }
        } else if (measureSamples.length) {
          // Framing broke mid-capture. Half a capture of a well-framed body
          // plus half of a cropped one is worse than either, so discard.
          measureSamples.length = 0;
          fitState = "waiting";
          fitDetail = "framing lost mid-capture — restarting";
        }
      }

      retarget(sw, res2.worldLandmarks[0]);
      align(smoothLandmarks(res2.landmarks[0], imageFilters, now));
      alignGroup.updateMatrixWorld(true);

      const poseDt = lastPose ? (now - lastPose) / 1000 : 0;
      lastPose = now;
      if (capsules.length) poseCapsules(capsules, twinModel, bodyFrame(), poseDt);

      trackedFrames++;
      // Drape only when EVERY gate passes. The old escape hatch — drape anyway
      // after 300 frames if the fit never converged — is exactly how a garment
      // ended up on a body whose shape params were all pinned at their clamps.
      // Waiting visibly, with an instruction on screen, is the honest failure.
      if (!autoDraped && ready && trackedFrames > 45) drape();
    }

    dotsCtx.clearRect(0, 0, W, H);
    if (showDots) drawDots(res2.landmarks?.[0]);
    if (!ready) drawCoach(lastImageLms);

    // MPMask owns GPU/WASM-side memory the JS garbage collector cannot
    // reclaim. Segmentation runs every frame, so failing to close it leaks
    // steadily until the tab dies. Must happen after all reads above.
    res2.segmentationMasks?.forEach((m) => m.close());
  }

  // HARD GATE. Not "is there a garment" — "is the input still valid". Stepping
  // the solver against capsules frozen at the last good frame produces a
  // garment draped on a body that is no longer there, which is worse than
  // showing nothing because it looks authoritative.
  steppingLastFrame = Boolean(sim?.gpu && garmentMesh && ready);
  if (garmentMesh) garmentMesh.visible = ready;
  if (steppingLastFrame) {
    const t0 = performance.now();
    sim.setCapsules(capsules);
    if (sim.step(dt, true)) sim.readbackInto(garmentMesh.geometry, renderPos);
    solveMs = solveMs * 0.9 + (performance.now() - t0) * 0.1;
  }

  frames++; acc += dt;
  if (acc >= 0.5) { fps = frames / acc; frames = 0; acc = 0; }

  const blocked = gates.filter((g) => !g.ok);
  statusEl.innerHTML =
    `${fps.toFixed(0)} fps · solve ${solveMs.toFixed(2)} ms` +
    (sim?.sim ? ` · ${sim.sim.N} particles` : "") +
    `<br><span style="color:${ready ? "#8c8" : "#fa0"}">` +
    (ready ? `ready · ${smoothScale.toFixed(0)} px/m`
           : `blocked: ${blocked[0]?.label ?? "starting"}`) + `</span>`;
  // ~8 Hz: fast enough to read, slow enough not to rebuild this much innerHTML
  // on every frame and fight the GC with the solver.
  if (now - lastPanel > 120) { lastPanel = now; renderPanel(); }

  renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------

(async () => {
  // Report which STEP failed and the error's .name — DOMExceptions from
  // getUserMedia often have an empty .message but a precise .name.
  let step = "WebGPU";
  try {
    device = await createDevice();
    device.lost.then((i) => { errEl.textContent = `GPU device lost: ${i.message || i.reason}`; });
    subsystems.gpu = true;

    step = "camera";
    await startCamera();
    step = "pose model";
    await loadLandmarker();
    subsystems.pose = true;
    boot();
  } catch (err) {
    const name = err?.name || "Error";
    errEl.innerHTML = `${step} failed: ${name}<br>${err?.message || "(no message)"}` +
      (name === "NotReadableError"
        ? "<br>→ another tab or app holds the camera." : "");
    console.error(step, err);
  }
})();
</script>
</body>
</html>
